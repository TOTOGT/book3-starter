<script>
const CHAPTERS = [{"title": "The Margin", "sub": "Toulouse, 1653", "html": "<p>The plague had a sense of humor, Fermat decided, somewhere around the third day of the fever. It had chosen him — a man who spent his life proving things could <em>not</em> exist, no solutions, no integers, no possible triangle — and was now attempting to prove, with rather more force than his own arguments ever mustered, that he did not exist either.</p><p>He found this, on the whole, very funny.</p><p>&quot;You are laughing,&quot; said his manservant, alarmed, dabbing his forehead with a cloth that had long since given up being cool.</p><p>&quot;I am appreciating an irony,&quot; Fermat said. &quot;Go and tell them I&#x27;m dead. Then come back in a week and tell them you were wrong.&quot;</p><p>He was not wrong to expect he might die, and not wrong, either, that he wouldn&#x27;t — not yet. Bernard Medon wrote to a friend in the Netherlands that the great Fermat had died; a week later he wrote again, sheepishly, that the great Fermat had un-died, and sent his regards.</p><p>It was, Fermat thought afterward, the only proof he&#x27;d ever produced that people were eager to see retracted.</p><div class=\"brk\">&#10022;</div><p>He remembered, in the worst of the fever, a conversation from some years before — half memory, half the fever&#x27;s own invention, he could never afterward say which — with a king who had wanted, very badly, to understand mathematics, and had not been able to.</p><p>Not from lack of trying. The king had sat through explanations of Fermat&#x27;s own devising — of numbers that refused to be the sum of two others, of a certain triangle whose sides could never all be whole — and had nodded in the particular way that powerful men nod when they have decided that understanding is beneath the effort of pretending not to understand.</p><p>&quot;Descartes made it look easy,&quot; the king had said once, not quite an accusation.</p><p>&quot;Descartes,&quot; Fermat had replied, &quot;made <em>himself</em> look easy. That is a different accomplishment.&quot;</p><p>The king had laughed at that — a real laugh, surprised out of him — and for a moment Fermat had liked him.</p><p>&quot;Teach me the thing in the margin,&quot; the king said. &quot;The one you won&#x27;t finish.&quot;</p><p>&quot;I finished it,&quot; Fermat said. &quot;The margin didn&#x27;t.&quot;</p><p>&quot;Then use a bigger margin.&quot;</p><p>&quot;Your Majesty,&quot; Fermat said, &quot;I have been offered bigger margins my whole life. I have never once taken one. I find the smallness clarifying.&quot;</p><p>The king had not understood that either. But he&#x27;d stopped asking, which Fermat took, in a man of his position, as a kind of grace.</p><div class=\"brk\">&#10022;</div><p>He did not die of the plague in 1653. He died twelve years later, in Castres, two days after signing his last judgment for the court — still a magistrate to the end, mathematics forever the thing he did in the margins of his actual life, never the center of it, which was, he sometimes thought, the only theorem he&#x27;d ever gotten exactly backward.</p>"}, {"title": "The Commission", "sub": "Toulouse, 1665 — some months before the world was told he was dead", "html": "<p>He was sixty-four, and he had begun, privately, to keep two sets of books.</p><p>The first was the one everyone could see: a man nearing retirement, tidying his affairs the way careful old men do, quietly transferring a parcel of land here, liquidating a modest holding there, each transaction defensible on its own, none of them alarming enough to draw a second look. A magistrate of thirty years&#x27; standing was entitled to put his house in order. No one at court thought to add the transactions together.</p><p>The second set of books existed nowhere but in his head, and it was the only proof, he sometimes thought with a private and entirely inappropriate amusement, that a man could commit an elaborate crime using nothing but arithmetic and patience.</p><div class=\"brk\">&#10022;</div><p>The commission itself had been almost embarrassingly easy to obtain. Grão-Pará and Maranhão were, on paper, a minor colonial concern — a distant, mosquito-ridden administrative headache that no ambitious man at Versailles wanted attached to his name. Fermat had simply needed to appear willing.</p><p>&quot;You wish to <em>go</em> there,&quot; the minister had said, not quite believing it. &quot;At your age.&quot;</p><p>&quot;At my age, Minister, a man wants quiet, and a warm climate for his joints. I am told the fevers there are survivable if one is careful, and I have spent my whole career being careful.&quot;</p><p>&quot;It&#x27;s hardly a post of honor.&quot;</p><p>&quot;I have had honor,&quot; Fermat said. &quot;I find I have grown tired of it.&quot;</p><p>This, unlike almost everything else he told the court that year, was the truth, and perhaps that was why it was believed so easily. He watched the minister write out the commission — an inspection of French trading interests and remaining colonial claims in the Grão-Pará region, a modest retinue, a modest budget, a departure to be arranged with no particular urgency — and felt something he recognized, from long acquaintance with his own mind, as the specific pleasure of a proof coming together.</p><p>He had built himself a door. Now he only had to walk through it before anyone thought to ask why.</p><div class=\"brk\">&#10022;</div><p>He saw her the night before he was meant to leave for the coast — the real leaving, not the death, which would come later, arranged with a physician he trusted and a fever that was real enough, just not fatal, timed to a season when plague was already rumored in three parishes and no one would think to look closely at one more quiet death among many.</p><p>She came to him in a borrowed cloak, the way she always did when the risk of being seen mattered more than the cold.</p><p>&quot;You&#x27;re really going,&quot; she said. Not a question. She had known for weeks; she had helped him choose which papers to burn.</p><p>&quot;I am really going. In three days, quite officially, on the king&#x27;s business. In four months, rather less officially, I intend to be dead.&quot;</p><p>&quot;That&#x27;s not funny.&quot;</p><p>&quot;It isn&#x27;t meant to be funny. It&#x27;s meant to be <em>precise</em>. There&#x27;s a difference, though I concede it&#x27;s often lost on people who aren&#x27;t magistrates.&quot;</p><p>She almost smiled at that — he watched her fight it, the way she always fought any softness that might be seen as weakness at court, and won, mostly, except at the corner of her mouth.</p><p>&quot;He&#x27;ll ask where I&#x27;ve gone,&quot; she said. &quot;Eventually. He asks about everyone.&quot;</p><p>&quot;He&#x27;ll be told you took a fever and were sent to your family&#x27;s country house to recover, and that the recovery, sadly, did not take. There will be a small, tasteful funeral. I&#x27;ve already spoken to the priest.&quot; He paused. &quot;I am becoming, I notice, extremely accomplished at arranging deaths that do not occur.&quot;</p><p>&quot;And if he doesn&#x27;t believe it?&quot;</p><p>&quot;Then he doesn&#x27;t believe it, and there is nothing left of you at court to find, and nothing left of me but a grave in Castres with my name already carved on it. A king does not dig up graves, Marie. It isn&#x27;t dignified. He will grieve you, briefly, the way he grieves anything that was his and is now simply gone, and then he will find something else to want.&quot;</p><p>She was quiet for a moment. &quot;You&#x27;ve thought about this longer than you&#x27;ve let me see.&quot;</p><p>&quot;I think about everything longer than I let anyone see. It is the only vice I never gave up.&quot;</p><div class=\"brk\">&#10022;</div><p>They did not speak, after that, of what would happen if it failed — if a bribed official grew greedy, if a ship&#x27;s manifest was checked too closely, if some clerk in Lisbon noticed that a French magistrate reported dead at Castres was, at the very same month, disembarking eight thousand miles away under a name that was almost, but not quite, his own.</p><p>Fermat had calculated the odds of every failure he could imagine, the way he calculated everything, and had arrived, in the end, at the only conclusion his life&#x27;s work had ever really produced:</p><p>Some things could not be proven in advance. They could only be attempted, and then lived, and the proof — if there was to be one at all — would have to be written afterward, by someone else, in ink he would never see dry.</p><p>He found, to his own surprise, that he was at peace with that. It was, perhaps, the first ungraded work he had ever agreed to hand in.</p>"}, {"title": "The Unfinished Cage", "sub": "Versailles, the night she left", "html": "<p>She had expected the dark. What she had not expected was the noise.</p><p>Even at this hour — past midnight, the court long since retired to whatever version of sleep a palace of that size permitted — the construction never fully stopped. Somewhere off toward the new wing, torches moved in a slow constellation as night crews shifted stone that the king&#x27;s masons had decided could not wait for daylight. The whole western approach was a wound of scaffolding and mud, half-raised walls standing pale and skeletal against the dark, waiting for a roof that would not exist for another decade.</p><p>It was, she thought, walking fast with her case held close against her borrowed cloak, the strangest possible place to be afraid of being seen. A palace under this much construction had a thousand shadows a fleeing woman could disappear into, and a thousand workmen too exhausted, too indifferent, too used to strange lights and strange movements in the dark to look twice at one more figure hurrying somewhere it wasn&#x27;t their business to ask about.</p><div class=\"brk\">&#10022;</div><p>She had heard the story, the way everyone at court eventually did, in the particular hushed, half-mocking, half-reverent tone reserved for the things that explained a king without anyone having to say so directly: how he had been ten years old, asleep in a Paris palace, when the mob came. How they had climbed into his very bedroom to make certain he had not fled the city in the night, and how he had lain there, a child, forced to feign sleep while armed strangers loomed over him deciding, in effect, whether he still belonged to them.</p><p>He had never gone back to that city the same way again. And now, seventeen years later, he was building this — walls thick enough that no mob would ever again cross them uninvited, a court so total and so gilded that every noble in France would eventually be made to live inside it, watched, accounted for, never quite out of his sight.</p><p>Marie understood, picking her way past a stack of unfinished cornices taller than she was, that she was walking through the exact shape of his fear, made permanent in stone. He had built an entire palace so that nothing like her — nothing that could simply vanish into a night he hadn&#x27;t authorized — would ever be possible again.</p><p>She was, perhaps, the last thing to slip out of Versailles before the cage was finished closing.</p><div class=\"brk\">&#10022;</div><p>A foreman&#x27;s lantern swung her way once, near the edge of the unfinished orangery, and she froze instinctively, every calculation Fermat had ever taught her running at once through her mind — <em>stand still, don&#x27;t run, running is what gets noticed</em> — but the man barely glanced at her, muttered something about the night shift&#x27;s water ration, and moved on. To him she was simply one more indistinct shape among the hundreds that moved through this endless, half-built site at every hour God made. The king&#x27;s obsession with control had, in its earliest and clumsiest years, produced exactly the chaos a person could disappear into.</p><p>By the time she reached the tree line at the edge of the grounds, the torches behind her had shrunk to a loose, scattered scatter of light, workers still raising walls for a king who would spend the rest of his reign trying to make sure no one ever left this place again without his knowing.</p><p>She did not look back a second time. She had already seen enough: an unfinished palace, half cage and half ruin, and a king asleep somewhere inside it who did not yet know that the one thing his stone and his guards and his obsessive, wounded need for control could not do was hold onto a woman who had already decided, calmly and completely, to be gone.</p>"}, {"title": "Ahead of the Arithmetic", "sub": "Versailles, six weeks before Fermat's own death was to be arranged", "html": "<p>She was not supposed to leave for another six weeks. Fermat had built the whole shape of it around that number — his commission granted, his affairs settled, his fever timed to a season when three parishes already had plague and no physician would look twice at a fourth quiet death. Six weeks was not arbitrary. Six weeks was the distance between two disappearances close enough to matter and far enough apart that no clerk, however clever, would think to draw a line between them.</p><p>She left in four days.</p><div class=\"brk\">&#10022;</div><p>It was not a plan that failed. It was a king who would not wait.</p><p>He had summoned her twice in one week, which he had never done before, and the second time he had not asked her to sing, or to sit near him while he read dispatches, or to do any of the small ornamental things he usually wanted of her. He had simply looked at her for a long moment and said, &quot;I am tired of admiring things from a distance, Marie,&quot; in the particular tone he used when he had already decided something and was only informing the room of the decision, not asking its opinion.</p><p>She understood, walking back to her rooms that night, that the six weeks did not exist anymore. There was tonight, and there was tomorrow, and after that there might not be a version of her life she recognized well enough to plan inside of.</p><p>She did not send word to Toulouse. There wasn&#x27;t time, and worse, she wasn&#x27;t certain the roads were still safe for a letter that said what this one would have to say. She took what fit in a single case, left the rest exactly where it stood — a scattered detail was more convincing than a clean one, she had learned that much from watching Fermat build his own disappearance — and was gone before the palace had properly woken.</p><div class=\"brk\">&#10022;</div><p>Fermat learned of it nine days later, from a merchant he half-trusted, in a letter that said almost nothing directly and meant everything.</p><p><em>The bird has left the garden ahead of the gardener&#x27;s schedule. The garden does not yet know.</em></p><p>He read it twice, standing in his own study surrounded by the second set of books that existed only in his head, and felt, for the first time since he had begun any of this, something close to fear — not for himself, but for the arithmetic. His plan had never accounted for a version of events in which she moved first and he was left to catch up to a decision already made.</p><p>He did the only thing his training had ever taught him to do with an equation that no longer balanced: he solved for the new unknown.</p><p>If she was already gone, already unaccounted for, already the subject of whatever quiet, urgent search a king mounts for something he has decided he wants and finds missing — then Fermat&#x27;s own six weeks of careful invisibility were not a luxury anymore. They were a liability. A magistrate who died at Castres <em>after</em> a woman went missing from Versailles was a coincidence. A magistrate who died at Castres two months after was a pattern, and patterns were the one thing his entire life&#x27;s work had taught him to notice in other men&#x27;s mistakes.</p><p>He sent for his physician that same afternoon, and told him the fever had come early.</p><div class=\"brk\">&#10022;</div><p>He did not know, yet, whether she had reached the coast. He did not know whether the ship still waited, or whether nine days was already too long a silence for a captain paid to be discreet, not loyal. He knew only that the careful shape of his plan — the one thing in his life he had built with the same precision he brought to a proof — had already broken before he&#x27;d had the chance to test it.</p><p><em>Some things could not be proven in advance</em>, he had told her, the night before he left. <em>They could only be attempted, and then lived.</em></p><p>He had meant it as comfort. He had not expected to be tested on it quite so soon, nor to find, turning the words over now with real fear behind them for the first time, how much less comforting they were when the proof in question was a person, and she had already gone ahead into the dark without him.</p>"}, {"title": "What the Plague Made Easy", "sub": "Toulouse, the same week Marie was already at sea and did not know it", "html": "<p>The physician&#x27;s name was Duval, and he had kept Fermat&#x27;s confidences for eleven years without once betraying them, which was either a testament to his loyalty or to how carefully Fermat had always calculated what to tell him and what to leave out. This time he told him almost everything, because this time he needed more than silence. He needed a body.</p><p>&quot;There is one,&quot; Duval said, on the second night, without being asked twice. &quot;A carter. No family left in the parish — his wife took the fever in the spring, his boy the week after. He died an hour ago, in the pest-house on the Bordeaux road, and no one there will come near enough to note the particulars of his face. They haven&#x27;t come near enough to note anyone&#x27;s face in a month.&quot;</p><p>That, Fermat understood, was the entire mechanism. Not deception — deception implied someone was looking closely enough to be deceived. This was simpler and darker than deception. This was the absence of anyone willing to look at all.</p><div class=\"brk\">&#10022;</div><p>The carriage that came for him that night was shuttered on every side, the driver&#x27;s face wrapped to the eyes, a physician&#x27;s mark chalked crudely on the door — the universal, terrible symbol that meant <em>do not stop this, do not ask about this, let it pass.</em> Toulouse had learned, over the preceding month, exactly what that mark required of its citizens, which was nothing. No questions. No lingered glances. A door shut quickly, a child pulled back from a window, a whole street&#x27;s worth of collective, practiced looking-away.</p><p>Fermat watched from an upper room as the carter&#x27;s body — wrapped, weighted at the shoulders in the manner Duval swore was standard practice for a plague death, no different from any of the eleven such bodies that street had already surrendered that month — was carried down and laid inside. He did not know the man&#x27;s face. He had made a point, in the last hour, of never learning it, on the theory that a stranger&#x27;s death should not be permitted to feel like anything other than what it was: a terrible, useful accident that he was about to make use of.</p><p>&quot;You understand,&quot; Duval said quietly, &quot;once this leaves the house, there is no version of events where you are still alive in France. I cannot call it back.&quot;</p><p>&quot;I am aware of what an irreversible operation looks like, Duval. I have spent my life proving which ones exist.&quot;</p><div class=\"brk\">&#10022;</div><p>The carriage did not go to the burial ground outside the city walls, where the recent dead were laid in unmarked ground too fast and too shallow for any grieving family&#x27;s comfort. It went, instead, the long way, down toward the river and the barge that would carry it to the coast, because Duval — practical in exactly the way eleven years of trust had taught Fermat to expect of him — had arranged for the body to be received not by a gravedigger but by a ship&#x27;s crew paid to understand only one instruction: a plague death, sealed, to be committed properly to the sea, well clear of any port, in the manner ships had used for a hundred years to keep contagion from following them into harbor.</p><p>No grave, then. No stone, no plot that some later, more careful hand might think to open. A death that existed everywhere in report and nowhere in fact — witnessed at a distance by an entire terrified street, verified up close by no one at all, and finally given to an ocean wide enough to keep any question from ever finding an answer.</p><p>The carter — whose name Fermat did not know, and would spend a strange, quiet portion of his remaining years wishing he had asked for, so that some prayer might be said for him that used the right word — went into the water not two hundred yards from where, three days later, a commissioned ship would take on a magistrate everyone in France now agreed was dead, standing at the rail beside a boy no one on board had any reason to look at twice.</p><p>Duval had arranged it that way on purpose, though he never said so outright, and Fermat only understood the full shape of it once he was standing at that same rail himself, watching La Rochelle&#x27;s harbor fall away. A death and a departure sharing one port, three days apart, drew less suspicion than two events pulled carefully apart across half of France — the same reasoning, applied once more, that had let a plague-marked carriage pass unquestioned through a street that wanted nothing to do with it. The safest place to hide two things was never far apart. It was in plain sight of each other, where no one thought to compare them at all.</p>"}, {"title": "The Boy Who Carried Nothing", "sub": "La Rochelle, the night the ship sailed", "html": "<p>Agnès had served her for six years, long enough to know which of Marie&#x27;s silences meant <em>leave me be</em> and which meant <em>stay close, I am frightened and will not say so</em>. This was the second kind, and had been for four days straight, ever since they&#x27;d left Versailles at a pace that left no room for explanation.</p><p>&quot;You understand what I am asking of you,&quot; Marie said, in the cramped room above the chandler&#x27;s shop where they had waited out the last two nights.</p><p>&quot;You are asking me to be seen,&quot; Agnès said. &quot;And you are asking me to be someone worth chasing.&quot;</p><p>&quot;Yes.&quot;</p><p>Agnès considered this for a moment, the way she considered most things — carefully, without hurry, in a way that had always made Marie feel, in the strange hierarchy of a court where she outranked her own maid in every visible way, that Agnès was in fact the calmer and wiser of the two of them.</p><p>&quot;Then I will need a good cloak,&quot; Agnès said. &quot;If I am to be a fleeing lady of quality, I should like to be convincing.&quot;</p><div class=\"brk\">&#10022;</div><p>The plan, such as it was, relied on a simple asymmetry: a king&#x27;s men, sent looking for a woman who had vanished from court, would look for a woman. They would ask innkeepers about a lady traveling with a maid, fine hands, an accent trained out of provincial roughness and into something that could survive a royal drawing room. They would not, in the ordinary run of things, look twice at a slight, quiet young clerk boarding a merchant vessel with ink-stained fingers and a satchel of ledgers, traveling in the retinue of an elderly royal commissioner bound for the colonies.</p><p>So Agnès took the cloak, and the coach north along the coast road that led away from La Rochelle, toward Nantes, moving just visibly enough, just carelessly enough, to be noticed and remembered by exactly the sort of person who might later be asked. She would not go far. She would stop at an inn two days&#x27; ride distant, claim a fever, claim confusion, claim — when it came to it, and it would come to it — that she had lost her mistress somewhere on the road and did not know where the lady had gone. It would hold long enough. It only needed to hold long enough.</p><p>Marie, meanwhile, cut her hair shorter than she had ever cut it in her life, bound what needed binding, borrowed a boy&#x27;s coat two sizes large from the chandler&#x27;s own son in exchange for coin that bought both the coat and his silence, and walked to the docks alone, in the dark, carrying nothing that looked like it belonged to a woman who had ever set foot in Versailles.</p><div class=\"brk\">&#10022;</div><p>She saw Fermat before he saw her, which surprised her — she had always assumed his eyes missed nothing, that noticing was simply the permanent condition of him. But he was occupied, at the base of the gangplank, in the particular performance he did so well: an old man fussing over trunks and manifests, a commissioner&#x27;s clerk hovering at his elbow, the whole tedious business of an official departure playing out exactly as tediously as an official departure should.</p><p>She fell into step near the back of his small retinue, shoulders down, satchel clutched the way a nervous young clerk might clutch it, and said nothing.</p><p>It was not until they were both aboard, until the gangplank had been drawn up and the last shouted business of the harbor had begun to fall away behind them, that he found a reason to stand beside her at the rail, the two of them apparently strangers watching the same disappearing coastline.</p><p>&quot;You cut your hair,&quot; he said quietly, not looking at her.</p><p>&quot;You said patterns were the one thing your work taught you to notice. I thought I&#x27;d give you less to notice.&quot;</p><p>&quot;It&#x27;s a very good disguise.&quot;</p><p>&quot;It has to be. I have no lady-in-waiting for two more days, at least, and no name of my own until we&#x27;re well past anywhere that name could still be caught.&quot;</p><p>He was quiet for a moment, watching La Rochelle become a smudge and then a line and then nothing at all.</p><p>&quot;I miscalculated the timing,&quot; he said. &quot;I want you to know that. Six weeks, I told you. Four days is not six weeks.&quot;</p><p>&quot;No,&quot; she agreed. &quot;But we are both on this ship, and no one on it knows either of our real names, and the coastline is gone.&quot; She glanced sideways at him, the first real look either of them had risked since the docks. &quot;I find I would rather trust the arithmetic that got us here than the arithmetic that didn&#x27;t.&quot;</p><p>He almost smiled at that — she watched him fight it, the particular vanity of a mathematician being told his error didn&#x27;t matter, and lose, mostly, except at the corner of his mouth.</p><p>&quot;Very well,&quot; he said. &quot;We&#x27;ll call it solved, then, and see what the ocean makes of the proof.&quot;</p>"}, {"title": "The Clerk Who Never Bathed With the Crew", "sub": "Somewhere in the Atlantic, month three", "html": "<p>A disguise, Fermat came to understand, was not a single decision made once at a dock in La Rochelle. It was a decision that had to be made again every single day, for months, against an enemy far more patient than any king&#x27;s man: the ordinary, grinding sameness of shipboard life, which left no corner of a person unexamined for long.</p><p>The first difficulty was water. A ship&#x27;s crew bathed rarely and carelessly, in full view of one another, and a clerk who never once joined them, who always found some pressing errand of the commissioner&#x27;s at exactly the hour the men stripped down on deck, was the kind of oddity that sailors — who had nothing to do for months but notice things about each other — eventually noticed.</p><p>The second difficulty was her hands. Marie&#x27;s disguise held up remarkably well from a distance: the cut hair, the borrowed coat, the deliberate slouch she had practiced in the mirror above the chandler&#x27;s shop until it looked less like a performance and more like a habit. But her hands had spent twenty years being a court lady&#x27;s hands, soft in a way that no clerk&#x27;s hands ever were, and by the second month the ropes and the ledgers between them had roughened them, but not nearly enough, not fast enough, and Fermat found himself inventing reasons — an injury, a rash, a family superstition about gloves — faster than he was entirely comfortable inventing them.</p><p>The third difficulty, which he had genuinely failed to calculate for, arriving at it only with a kind of belated, mortified respect for a variable his own life had never required him to consider, was that a woman&#x27;s body did not stop being a woman&#x27;s body simply because a coat had been put over it. There were days, each month, when Marie disappeared entirely into the small cabin Fermat had commandeered &quot;for commission papers requiring privacy,&quot; and did not emerge, and Fermat stood outside that door inventing commissioner&#x27;s business for anyone who asked, and understood, with the same clear-eyed precision he brought to everything else, that this was the one part of the entire scheme he could not solve with arithmetic. He could only stand guard over it.</p><div class=\"brk\">&#10022;</div><p>The man who noticed first was Bertrand, the ship&#x27;s carpenter, a quiet sort who noticed everything and said very little, which Fermat had at first mistaken for stupidity and later came to recognize, with some alarm, as the opposite.</p><p>&quot;Your clerk,&quot; Bertrand said to him one evening, not quite a question, &quot;keeps unusual hours.&quot;</p><p>&quot;My clerk,&quot; Fermat said, &quot;keeps my hours, which are the hours of a man arranging a colonial commission from a berth too small for the paperwork it requires.&quot;</p><p>Bertrand said nothing further that night. But Fermat noticed, after that, how Bertrand&#x27;s eyes followed the boy across the deck — not with suspicion exactly, not yet, but with the specific attention of a man doing sums in his head and not yet certain of the total.</p><p>Others followed. A sailor remarked, within Fermat&#x27;s hearing but not quite to him, that the commissioner&#x27;s clerk had a voice too gentle for the work he claimed to do. The cook, who fed the crew twice daily from a single vantage point that saw everyone eat or fail to eat, noted that the boy ate like someone raised at a table with linen on it, small bites, an economy of motion no clerk&#x27;s upbringing had ever produced.</p><p>Fermat could not silence a whole crew&#x27;s worth of small observations. He could only, with the same calculated patience he had once used to secure a royal commission from a minister who didn&#x27;t want the posting, make the cost of speaking aloud higher than the cost of staying quiet — an extra ration here, a debt quietly forgiven there, a private word to Bertrand specifically that a commissioner grateful for a carpenter&#x27;s discretion was a commissioner who remembered such things when postings and favors were handed out in the colony.</p><p>It worked, in the sense that no one said anything. It did not work in the sense that mattered most: by the fourth month, there was not a man on that ship who fully believed the clerk was a clerk, and a belief that goes unspoken for months does not disappear. It only waits, gathering a kind of quiet resentment at having been made to pretend, for the moment when pretending no longer serves any purpose at all — the moment, say, when a ship is breaking apart on a reef, and a crew already halfway convinced they had been lied to for four months finds it remarkably easy to row away and let the liars manage the consequences themselves.</p>"}, {"title": "What the Sea Already Knew", "sub": "Month five, and then the reef", "html": "<p>It was Bertrand, in the end, who gave the thing its name — not out of malice, Fermat thought later, but because sailors were a people who needed every misfortune to have a name, a shape, something that could be blamed and thereby, however uselessly, avoided next time.</p><p>&quot;There&#x27;s a woman aboard,&quot; Bertrand said to the cook, low, at the rail, in a voice that carried exactly as far as he meant it to and no farther. &quot;Has been the whole voyage, dressed as that clerk. I&#x27;d stake my hands on it.&quot;</p><p>He did not say it as an accusation. He said it the way a man reports weather — a fact now settled into the ship&#x27;s understanding of itself, passed from Bertrand to the cook to the boatswain to every hand aboard within two days, and once it had passed, it did not need to be spoken of again. It only needed to be <em>known</em>, the way sailors had always known that a woman on a ship was a debt the sea would eventually collect, in its own time, at its own price.</p><p>They did not confront Fermat. They did not confront Marie. They simply began, in the small unconscious ways sailors have always managed a feared thing, to keep their distance, to touch iron when she passed, to mutter under their breath at a wave that broke wrong or a wind that turned sour, building — plank by superstitious plank — a case against her that required no evidence at all, only the accumulating coincidence of an ordinary voyage&#x27;s ordinary bad days.</p><p>By month five, when the storm came up fast and ugly off a coast none of them had charted well, there was not a man aboard who needed to be told what it meant.</p><div class=\"brk\">&#10022;</div><p>The reef took the hull before anyone had time to do more than shout it. Fermat felt the whole ship shudder the way a body shudders at a wound it hasn&#x27;t yet understood is fatal, and then the deck was tilting, and the sea was coming up through the boards in a way the sea was never meant to.</p><p>He saw the crew move before he&#x27;d fully understood they were moving <em>away</em> — not toward the rigging, not toward the pumps, not toward any of the ordinary desperate tasks of men trying to save a ship, but straight to the longboat, hauling it over with a speed and a coordination that told him, even through his own rising panic, that this had been decided before the reef, not after it. They had been waiting, without quite admitting it to themselves, for the sea to do what they&#x27;d already agreed it would eventually do.</p><p>&quot;Rope!&quot; he shouted, and got no answer, and understood the answer was the silence itself.</p><p>Bertrand was the last one into the boat. He looked back once — not at Fermat, and not with any triumph in it, only the flat, closed look of a man who had already decided the matter was out of his hands and put there deliberately, days ago, in his own mind, so that this moment would cost him nothing when it came.</p><p>Then the oars bit the water, and the longboat pulled away into the storm, and did not look back again.</p><div class=\"brk\">&#10022;</div><p>It was in that moment — the ship breaking under him, the trunk of silver sliding past in the flooding hold catching what little light there was and throwing it back in a thousand small, useless brilliances, his own hand closing on the smaller bag of coin because the trunk was already gone, already too heavy, already someone else&#x27;s now — that Fermat felt something enormous surface beside him in the water, and did not, at first, understand it was mercy.</p><p>The beast was vast and grey and utterly unhurried, moving through the wreck-churned water the way nothing else in that storm was moving, without panic, without hurry, as though the sea&#x27;s violence were simply weather it had decided not to take personally. He grabbed for its thick, coarse hide because there was nothing else left in the world to grab for, and felt Marie&#x27;s hand close over his wrist a moment later, hauling herself toward the same broad back, and neither of them, in that first drowning minute, thought to wonder why an animal built for river mud and mangrove shallows was here at all, in open water, exactly when they needed it.</p><p>They only knew that the longboat was gone, small and receding into the rain, its oars pulling away from two people the crew had already decided, weeks before the reef ever found them, deserved whatever the sea saw fit to do.</p><p>The buffalo did not deserve any of their fear. It simply swam, steady and enormous and entirely unbothered, toward a shore none of them could yet see, carrying the curse and the calculation both, equally, without troubling itself over which was which.</p>"}, {"title": "The Small, Colorful Demons", "sub": "The sandbar, first light", "html": "<p>The buffalo did not so much land them as simply stop, at some point in the grey hour before dawn, in water shallow enough that stopping was possible, and Fermat understood only afterward that this had been its own kind of mercy — that the beast had chosen the moment of arrival as carefully as it had chosen everything else about the crossing, waiting until the storm&#x27;s worst violence had spent itself before it allowed the two of them to slide, boneless, into the wet sand.</p><p>He lay there for a long time without moving, salt-crusted and blind with exhaustion, aware only that Marie was somewhere near him, breathing, which was more than he had let himself hope for during the worst of the swim. When he finally raised his head, the world had gone the flat, colorless grey of very early morning, and the buffalo — his buffalo, he found himself already thinking, with an ownership he had no right to and did not intend to examine — stood a few feet off, utterly unbothered, as though it had done nothing more remarkable than cross a particularly wide puddle.</p><p>&quot;We&#x27;re alive,&quot; Marie said. It was not a question, but it did not sound entirely certain either.</p><p>&quot;We are extremely alive,&quot; Fermat said, &quot;and extremely covered in sand, which I am given to understand is not the same as being safe, but is a considerable improvement on the alternative.&quot;</p><p>It was only now, with real light finally reaching the flats, that either of them properly saw the thing that had carried them. In the storm it had been a shape, a grip, a fact to be grateful for without examining too closely. In the grey morning it was simply enormous — a vast, slate-hided animal the size of nothing either of them had ever stood beside, horns swept back like something out of an old bestiary, entirely too large to have swum an open, storm-churned sea with two drowning Europeans clinging to its back, and entirely unbothered by having done exactly that.</p><p>Marie stared at it for a long moment, then pushed herself upright in the sand, brushing at her ruined skirts with the particular dignity of a woman determined to recover at least one scrap of composure.</p><p>&quot;I am extremely grateful to it,&quot; she said. &quot;I want that understood. But I would never ride such a creature again. Not for any reason.&quot;</p><p>&quot;Noted,&quot; said Fermat, who had learned, over six years, exactly how much weight to put on Marie&#x27;s declarations of what she would never do, which was to say: precisely as much weight as the next hour of circumstance allowed her to keep.</p><div class=\"brk\">&#10022;</div><p>The sun came up fast, the way it seemed to do everywhere in this part of the world, with none of Europe&#x27;s slow, apologetic dawns, and with the light came the tide&#x27;s retreat, drawing back off the flats in front of them with a long, hissing sigh — and with the retreating water came the sand itself waking up.</p><p>Fermat saw the first claw before he understood what he was seeing: a bright, improbable blue, waving up out of a hole in the mud as though the earth itself had grown a hand. Then another, and another, dozens, then what looked like hundreds, the whole flat suddenly alive and bubbling and clicking with creatures the size of a man&#x27;s open hand, shells the impossible colors of a court painter&#x27;s most extravagant palette, advancing across the sand in a slow, scuttling, entirely serious tide of their own.</p><p>Marie made a sound he had never heard her make in six years of knowing her — not a court sound, not a composed sound, nothing that Versailles had ever trained into her — and scrambled backward so fast she nearly fell, catching herself instead on the buffalo&#x27;s foreleg and hauling herself, with a speed her ruined skirts should not have permitted, up onto its broad wet back.</p><p>&quot;Those are not natural,&quot; she said, from a height she clearly intended to keep.</p><p>&quot;They are extremely natural,&quot; Fermat said, watching one particularly large specimen wave a claw the color of a robin&#x27;s egg in what he chose to interpret as a greeting. &quot;Nature has simply declined, in this part of the world, to consult European taste before deciding what a crab should look like.&quot;</p><p>&quot;I don&#x27;t care what they <em>are</em>, Pierre, I care that there are a thousand of them and they are coming <em>this way</em>.&quot;</p><p>He considered the advancing tide of claws with the same flat, assessing attention he had once given a difficult legal brief, weighed it against his own aching, sand-caked, sixty-four-year-old legs, and arrived, not for the first time in recent memory, at a conclusion his life&#x27;s work had never quite prepared him to phrase so plainly.</p><p>&quot;I find,&quot; he said, already turning to look for a handhold of his own on the buffalo&#x27;s broad grey shoulder, &quot;that I would very much rather be eaten by nothing at all than stay here to discover which of us they intend to try first.&quot;</p><p>The buffalo, for its part, showed no interest whatsoever in the small blue army assembling around its feet. It simply began to walk, unhurried, its great hooves finding the firm ground beneath the mud without any apparent effort, crushing an idle path directly through the scuttling ranks as though they were no more than a particularly loud patch of gravel — carrying an old mathematician and a woman who had once outlasted the sharpest tongues at Versailles, both of them equally undone, for the moment, by an army of crabs.</p>"}, {"title": "What the Cat Wanted", "sub": "Deeper into the mangroves, past midday", "html": "<p>The buffalo slowed before either of them understood why, and it was another full minute before Fermat saw it: a shape low in the fork of a mangrove root, gold and black and entirely still, watching them with an attention that had nothing hurried in it at all.</p><p>Marie&#x27;s hand found his arm without either of them deciding it should. &quot;Pierre.&quot;</p><p>&quot;I see it.&quot;</p><p>&quot;What <em>is</em> it doing?&quot;</p><p>It was, as far as Fermat could tell, doing nothing more alarming than a very large, very beautiful cat holding its own council, head tilted, nostrils working the humid air in slow, deliberate pulls, its golden eyes moving over the two of them with a curiosity that looked, absurdly, almost scholarly — the same unhurried attention Fermat himself might have given an unfamiliar equation before deciding whether it was worth the trouble of solving.</p><p>&quot;I believe,&quot; he said, keeping his voice as level as six months of practiced calm could make it, &quot;that we smell extremely strange to it.&quot;</p><p>&quot;We smell <em>extremely strange</em> to <em>everyone</em>, Pierre, we have not bathed properly in five months.&quot;</p><p>&quot;Precisely my point. To a creature that hunts by scent, two Europeans marinated in salt, mud, buffalo, and considerable personal despair do not smell like anything it has ever been taught to want. I suspect it is simply trying to decide what we are, in the way a man might stare at a coin from a country he&#x27;s never traded with.&quot;</p><p>The jaguar&#x27;s tail moved, once, an unhurried flick, and it did not come down from the root, and it did not look away, and for the length of perhaps four breaths the entire mangrove seemed to hold itself as still as the cat did, waiting to see which way the arithmetic of the moment would resolve.</p><p>It was the buffalo that resolved it. The great beast, which had not so much as broken stride at the sight of the jaguar, continued forward at exactly the pace it had been keeping since the sandbar, hooves finding the firm ground beneath the mud with the same placid indifference it had shown the crabs, the storm, the open sea — passing close enough beneath the mangrove root that Fermat could have reached out and touched the animal&#x27;s paw, and never once turning its great head to acknowledge the danger at all.</p><p>The jaguar watched them go. It did not follow. Whatever question it had been turning over in that unhurried, golden-eyed way, it seemed, in the end, to decide the two strange-smelling creatures riding the indifferent giant were not worth the trouble of an answer.</p><p>&quot;It&#x27;s letting us pass,&quot; Marie whispered, once the shape had fallen behind them and the mangrove had swallowed it from sight.</p><p>&quot;I don&#x27;t believe it thought of it as <em>letting</em> anything,&quot; Fermat said. &quot;I believe it simply couldn&#x27;t find a category for us, and a creature that cannot categorize something is, in my experience — admittedly gained entirely from magistrates rather than jaguars — generally reluctant to commit to eating it.&quot;</p><p>Marie let out a breath that was not quite a laugh, but was closer to one than anything she&#x27;d managed since the wreck. &quot;I have never in my life been grateful to smell this badly.&quot;</p><p>&quot;Nor I,&quot; Fermat said, and meant it, and found himself thinking, not for the first time on this strange, drowned, buffalo-carried journey, that the whole of his life&#x27;s careful arithmetic had never once prepared him for a proof this simple: that safety, out here, had nothing to do with cleverness at all, and everything to do with smelling like something the jungle had no name for.</p>"}, {"title": "The Ceiling", "sub": "The edge of the mangroves, and then the fort", "html": "<p>The first sign of other people was smoke — a thin grey thread rising above the canopy, ordinary and domestic in a way that struck Fermat, after five months of storms and reefs and jaguars weighing their scent, as almost unbearably moving. Someone, somewhere ahead of them, was cooking fish over a fire, entirely unaware that two ruined Europeans and a very large, very calm water buffalo were about to walk into the middle of their afternoon.</p><p>It was children who found them first — three of them, barefoot, fishing spears forgotten in their hands, staring up at the buffalo and its passengers with an expression that held far more curiosity than fear. One of them said something in a language Fermat didn&#x27;t recognize, quick and bright, and ran ahead through the trees before he could think of a way to answer.</p><p>&quot;They&#x27;ve gone to tell someone,&quot; Marie said.</p><p>&quot;I imagine they&#x27;ve gone to tell everyone,&quot; Fermat said. &quot;I would, in their position. I cannot think of a single thing in my own life half as interesting as what they just saw.&quot;</p><p>The children&#x27;s voices carried ahead of them through the trees, rising and multiplying, and somewhere in that relayed excitement Fermat understood, with the particular relief of a man finally permitted to stop calculating, that the worst of the journey was behind them. There was nowhere left to fall. Whatever came next — soldiers, questions, the long slow work of inventing a life — could not possibly be worse than the reef, or the crew, or the open sea.</p><p>It was exactly then, with the danger finally behind them and nothing left to keep her upright but will, that Marie&#x27;s grip on him loosened, and she slid sideways off the buffalo&#x27;s broad back before he could do more than lurch toward her.</p><p>He caught her before the mud did — his own arms shaking with an exhaustion he&#x27;d been refusing to acknowledge for hours, his legs barely steadier than hers — and hauled her, with a groan he made no effort to disguise, back across his own lap on the buffalo&#x27;s back, her head falling against his soaked and filthy shirt.</p><p>&quot;You are not permitted to die of relief,&quot; he told her, quite sternly, though she couldn&#x27;t hear him. &quot;I did not carry us through a reef and a curse and an army of blue-clawed demons to lose you to a <em>fainting spell</em>.&quot;</p><p>She did not answer, and the buffalo did not stop walking, and Fermat — dead tired in every part of himself, sixty-four years old and further from home than he had ever imagined being — found the only strength he had left was in his voice, and used it, murmuring to her in a low, steady mixture of Latin and old French that had nothing to do with what he was saying and everything to do with simply not stopping.</p><p>&quot;We have hit the ceiling,&quot; he told her, over and over, counting it out against the rhythm of the buffalo&#x27;s slow, unhurried steps. &quot;There is nowhere left to fall. Do you hear me, Marie? The descent has a floor, and we have found it, and now there is only the climbing back up.&quot;</p><div class=\"brk\">&#10022;</div><p>The gates of the fort, when they finally reached them, were already crowded with soldiers who had clearly been told to expect <em>something</em>, though nothing in their faces suggested they had believed it until they saw it for themselves: an enormous, mud-slicked, unbothered beast walking out of the mangroves at the exact center of the afternoon, carrying on its back an old man who looked like he had not slept in a year, cradling an unconscious young woman with a tenderness that belonged to no invading army anyone had ever been trained to fear.</p><p>A young officer took one look, crossed himself, and turned to shout something back into the fort that Fermat didn&#x27;t understand but recognized instantly all the same, because it was the sound every group of frightened, curious men made in every language he had ever learned: <em>come and see this.</em></p><p>He straightened his back as best his exhausted spine allowed, arranged his face into the calm, unhurried authority of thirty years spent commanding a courtroom&#x27;s attention, and began, in careful, formal Portuguese, to explain that he was a shipwrecked merchant, that the lady was his charge, and that he would be very grateful indeed for a place to let her rest.</p><p>It was, he thought, the first entirely true thing he had said aloud in five months, if one did not count the merchant part, or the shipwreck, or very nearly everything else. But the gratitude, at least, was real. He held onto that, and let the rest be handled, for now, by the last reserves of a mind that had gotten them this far on arithmetic alone.</p>"}, {"title": "What the Name Was Still Doing There", "sub": "The fort, and then the town — the first four days", "html": "<p><em>(Supersedes <code>what_the_shore_was_called.md</code>, which staged this material during the arrival and contradicted The Small Colorful Demons, What the Cat Wanted, and The Ceiling. That file should be deleted.)</em></p><div class=\"brk\">&#10022;</div><p>They gave Marie a room with a window, which Fermat understood, correctly, to be the most valuable thing anyone in that fort had to give.</p><p>She slept for a day and a half. He sat in the corridor outside it for most of that, upright on a bench built for waiting, refusing three separate invitations to lie down himself, on the grounds — which he offered to no one and would not have been able to defend — that he had watched her slide off a buffalo&#x27;s back once already and did not intend to be elsewhere the next time something took her without warning.</p><p>A garrison surgeon looked at her twice and said, both times, the same word, which Fermat did not know but could translate from the man&#x27;s face: <em>exhaustion.</em> Not fever. Not the thing everyone in a colonial fort watches for. She had simply run out, five months and a reef and a jungle after she should have, and her body had finally been permitted to say so.</p><p>&quot;She will wake hungry,&quot; the surgeon said, in slow Portuguese for the foreigner, &quot;and she will be angry about something. That is how you will know.&quot;</p><p>She woke on the second evening, ate everything within reach, and was extremely angry about the state of her hair.</p><p>Fermat, sitting on the floor beside the bed because the chair had been given to someone with a better claim, put his head back against the wall and laughed until his ribs hurt.</p><div class=\"brk\">&#10022;</div><p>It was in that first day and a half, with nothing to do but sit on a bench and be spoken past, that he heard the name and did not, at first, believe it.</p><p>He heard it perhaps a dozen times before it registered — from the surgeon, from a corporal, from two women carrying water, from a boy who had been sent to tell him something he could not follow — and each time it went by him as one more unfamiliar sound in a day made entirely of them. <em>São Luís.</em> It was only when a sergeant said it slowly, twice, pointing at the floor to mean <em>here, this place</em>, that Fermat heard what was inside it.</p><p><em>Saint Louis.</em></p><p>He asked. It took most of an afternoon and three people to assemble the answer, in his bad Portuguese and their worse French, and when he had it he sat with it for a long time.</p><p>Frenchmen had built this. Not conquered it, not renamed it — <em>built</em> it, from nothing, in the year twelve, and had named the fort for the boy who was then king at home. They had held it three years. In the year fifteen the Portuguese had thrown them out, and had kept the harbour, and the fort, and — for fifty-one years, without apparently finding anything odd in it — <strong>the name.</strong></p><p>Then the Dutch had come, in the year forty-one, with nineteen ships, and had been thrown out in their turn after three years. And the name had survived that too.</p><p><em>Two occupations,</em> Fermat thought. <em>Two flags taken down. And the thing that stayed was a word.</em></p><p>He was a man who had spent his working life on the question of what survives an operation — what is left invariant when you transform, substitute, reduce. He turned it over on a bench in a corridor eight thousand miles from Toulouse and arrived at something he found genuinely beautiful and did not have anyone to tell.</p><p><em>You can expel the men. The men are the removable part.</em></p><div class=\"brk\">&#10022;</div><p>The packet had come through the sea because it had been sewn into a coat.</p><p>That was the whole of it. Three ships of livestock, thirty years of quiet transactions, the trunk he had nearly drowned trying to lift — all of it at the bottom, and the one object that survived was a folded oilcloth against his chest that he had never once thought of as an asset, because it had been the <em>cover</em>, not the cargo.</p><p>He opened it on the third night, alone, and spread it on the floor by the window where Marie was sleeping properly for the first time in half a year.</p><p>It was undamaged. The seal was whole. An inspection of French trading interests and remaining colonial claims in the Grão-Pará region, a modest retinue, a modest budget, the minister&#x27;s own hand at the bottom — a genuine instrument of the French crown, correctly executed, entirely in order.</p><p>Made out to a man who had died in Castres in January, and been carried down to the coast in a shuttered carriage with a physician&#x27;s mark chalked on the door, and put into the sea two hundred yards from where the ship had taken him aboard three days later.</p><p>He could present it in the morning. That was the thing he made himself look at squarely, the way he had made himself look at every step of this. He could walk into the governor&#x27;s rooms and be received — housed, fed, funded, listened to. A letter of credit drawn on the French crown was the only asset he had left in the world, and it existed entirely because a minister at Versailles believed he was alive.</p><p>He would be received once.</p><p>And then a clerk would enter the name in a book, because that is what a clerk is for. And the book would be copied to Belém, and to Lisbon, and eventually — not quickly, nothing crossed that water quickly, but <em>eventually</em>, in the unhurried and entirely reliable way that paper crosses an ocean — to Paris. Where it would sit in some office, in the same hand, six months after a death notice from Toulouse.</p><p>Two entries. One name. Two sides of an ocean.</p><p>Duval had understood it better than he had, and had said it plainly at the time without either of them noticing it was the whole doctrine: <em>the safest place to hide two things is in plain sight of each other, where no one thinks to compare them.</em> That worked because a death and a departure three days apart in one port were a single event that nobody had a reason to take apart. Two of the same <em>name</em>, six months and four thousand leagues apart, were not that. They were the other thing.</p><p>They were a pattern. And patterns were the one thing his entire life&#x27;s work had trained him to notice in other men&#x27;s mistakes.</p><p>He folded the commission back into the oilcloth and did not present it in the morning, or ever, and spent a not inconsiderable part of the next twenty years knowing exactly where it was.</p><div class=\"brk\">&#10022;</div><p>So he needed a name, and discovered — sitting on the floor at four in the morning with the only useful document he owned rendered permanently useless by his own reasoning — that he had never made one.</p><p>This astonished him. He had solved for the physician, the carter, the barge, the port, the three-day interval, the manifest, the retinue, the cargo, the climate, the season, the plague. He had solved for Agnès in a good cloak on the Nantes road. He had solved for a hold full of animals against the advice of every man he consulted.</p><p>He had not solved for what he would be called.</p><p>Because — he made himself finish the thought, since he had never in his life permitted himself to abandon a line of reasoning simply because he disliked where it was heading — because some part of him had gone on assuming that the arrangement was temporary. That there would be a version of the future in which the name came back. He had built an irreversible operation and had privately, unexaminedly, declined to believe in it, and it had taken a shipwreck, a jaguar, and a Portuguese sergeant pointing at the floor to make him notice.</p><p>In the morning a corporal asked him, with a wax tablet and the particular patience of a man who has asked several times.</p><p>He heard himself say: &quot;Pedro.&quot;</p><p>It was not one of the eleven answers he had ranked off the Canaries. It was simply his own name with the corners taken off — the smallest possible transformation, the least he could bring himself to do, and the corporal wrote it down without any sign of having witnessed a man give up fifty years of correspondence, four countries&#x27; worth of reputation, and the only word that had ever meant <em>him</em>.</p><p>Later, he would find this funny. Later, he would tell Marie that he had spent forty years proving that certain forms cannot be reduced, and had folded at the first clerk with a tablet.</p><p>Marie, from the bed, said: &quot;And me?&quot;</p><p>He turned around.</p><p>He had solved for a woman leaving Versailles in four days instead of six weeks. He had solved for a clerk who could not bathe with the crew and whose hands were wrong. He had stood outside a cabin door for five months inventing commissioner&#x27;s business, and had never once, in three years of arithmetic, written down what she would be called on the far side of it.</p><p>He did not know, even now, whether that was because he had trusted her to choose it herself — or because some part of him had refused to draft a version of her that was his to draft.</p><p>&quot;I don&#x27;t know,&quot; he said. &quot;I never did it. I am sorry.&quot;</p><p>She thought about it for a moment, in the borrowed room, with her hair in a state she had already described at length.</p><p>&quot;Maria,&quot; she said. &quot;It&#x27;s the same. I&#x27;d rather not learn to answer to something new.&quot;</p><p>&quot;That is precisely the reasoning I used, and I called it cowardice.&quot;</p><p>&quot;You would.&quot; She lay back. &quot;It isn&#x27;t cowardice, Pierre. It&#x27;s the only thing either of us brought.&quot;</p><div class=\"brk\">&#10022;</div><p>He went out into the town on the fourth day, because Marie was asleep again and he could not sit on the bench any longer, and because there was a question he had been carrying since the corridor and could not put down.</p><p><em>A city named for a French king, in Portuguese hands, for fifty-one years.</em></p><p>He wanted to know what else had stayed.</p><p>The answer met him at the end of the second street, in the form of a boy of about ten sitting on a low wall with his heels knocking against it, who watched the strange old man come up the road with the frank, unbothered attention of a child who has decided that whatever this is, it is happening in his street and therefore concerns him.</p><p>He was Indian. There was nothing in the least European about him — not the face, not the hair, not the way he sat, not one thing about him that would have made a man in Toulouse look twice at anything except the ordinary strangeness of a boy from the other side of the world.</p><p>His eyes were blue.</p><p>Fermat stopped walking.</p><p>The boy said something. It was short, and it went past him entirely, and Fermat — standing in the middle of a road in a Portuguese colony four thousand leagues from anywhere he had ever been a person, with a name he had invented four days ago and had not yet got used to answering to — heard himself say, quietly, to nobody, in the language he had not used aloud in eleven days:</p><p>&quot;<em>Qu&#x27;est-ce que vous avez dit?</em>&quot;</p><p>He did not decide to say it. That was the part he would turn over for the rest of his life. He had been Pedro for four days, and had been careful for fifty years, and the sentence came out of him without passing through anything that could have stopped it, in the accent of the Parlement of Toulouse, on a street where such a sound had no business existing.</p><p>The boy stopped knocking his heels against the wall.</p><p>Then he leaned forward slightly, the way a child does when an adult has finally said something worth attending to, and repeated himself — patiently, a little louder, in the manner of someone helping out a foreigner who has plainly not been getting much help —</p><p>in French.</p><p>&quot;<em>C&#x27;est à vous, ça?</em>&quot;</p><p>Fermat stood there for a long moment. Sixty-four years old, four thousand leagues from home, officially dead, holding nothing, having just broken five months of discipline in a single reflex and received it back from a barefoot boy who had never in his life met a Frenchman.</p><p>The vowels were wrong. That was what undid him. They had been somewhere warm for two generations and they had gone soft and long in a way no one in France would have recognised as anything but a mistake — and it was, unmistakably and completely, French, and it was fifty-one years old, and it had been sitting on this street the entire time waiting for somebody to say the first word.</p><p>He looked past the boy, up the north road, where a very large grey animal was standing in the shade doing nothing whatsoever.</p><p>&quot;<em>Oui</em>,&quot; he said. &quot;I believe she is. Though I should tell you it is not at all clear that she agrees.&quot;</p><div class=\"brk\">&#10022;</div><p><em>Note for the margin: São Luís was founded in 1612 by Daniel de La Touche, Sieur de La Ravardière, as the seat of la France Équinoxiale, and named for Louis XIII. The Portuguese expelled the French at the end of 1615, after the fighting at Guaxenduba the year before, and kept the name. The Dutch took the city on 25 November 1641 with nineteen ships and two thousand men, and were driven out in 1644. It is the only Brazilian capital founded by Frenchmen, and nobody has ever found it necessary to call it anything else.</em></p><p><em>Both occupations left children. Nobody stayed for them.</em></p>"}, {"title": "We Built It Last Week", "sub": "Told to Fermat on a step, by a man his own age, in the fifty-first year", "html": "<p>The man&#x27;s name was Aubin, or had been, or was the part of a longer name that had survived being said aloud in Portuguese for half a century. He was fifty-two, missing most of the teeth on one side, and he had the specific fluency of someone who has spoken French every day of his life and never once to a stranger.</p><p>Fermat had asked him — carefully, having learned in four days that careful questions were the only kind that got answered — how it was that anyone here spoke French at all.</p><p>Aubin thought this was the funniest thing he had heard in some time.</p><div class=\"brk\">&#10022;</div><p>&quot;They threw us out,&quot; he said, when he had recovered. &quot;In the year fifteen. My mother was two. Everybody agrees about this. The Portuguese threw the French out of Maranhão, there was fighting at Guaxenduba the year before, La Ravardière went home in a ship, it is all extremely well established.&quot; He spread his hands. &quot;And then everybody left.&quot;</p><p>&quot;Everybody left,&quot; Fermat repeated.</p><p>&quot;Everybody left,&quot; Aubin agreed. &quot;Except the ones who did not.&quot;</p><p>He explained it with the patience of a man who had explained it before, though probably not in French.</p><p>An expulsion is a thing done to an army and a governor and a flag. Those are the parts that can be put on a ship, and they were. What could not be put on a ship — because nobody thought of it as French, including, largely, itself — was a few hundred people who had been living up and down that coast for three years, who had married into Tupinambá families, who had children, who had no property in France to return to and in several cases no France they had ever seen.</p><p>&quot;So we did not leave,&quot; Aubin said. &quot;We just stopped being <em>anything.</em>&quot;</p><div class=\"brk\">&#10022;</div><p>Fermat asked who, exactly. He was, even four days in, still a man who wanted the particulars.</p><p>Aubin counted it on his fingers, without hurry.</p><p>&quot;The women,&quot; he said. &quot;First. Always first. They were Tupinambá — this is their country, senhor, they were not <em>going</em> anywhere, and nobody had ever asked them whether they wished to be French in the first place. A ship arrives and says you are now French. A ship leaves and says you are now nothing. The women were exactly as much of one as of the other, which is to say not at all, and they stayed where they had always been standing.&quot;</p><p>&quot;And the children.&quot;</p><p>&quot;The children stayed with the women. Where else.&quot; He shrugged. &quot;Some of the fathers wanted to take them. A few asked. But you cannot put a child of two on a ship to a country where it is a bastard and nobody speaks to its mother, and most of them worked that out on the beach, and it is the one decent calculation any of them made.&quot;</p><p>He was quiet for a moment.</p><p>&quot;And then there were the men who stayed.&quot;</p><div class=\"brk\">&#10022;</div><p>Fermat had assumed — he examined the assumption afterward and did not like what it revealed about him — that any Frenchman who remained had done so out of something. Love of the place. Ambition. A grudge against the crown. Some motive with an edge to it that a magistrate could file.</p><p>&quot;No,&quot; Aubin said, when he put it that way. &quot;Some, maybe. My mother&#x27;s husband, I think — I do not know, he did not talk about it. But mostly?&quot;</p><p>He looked out at the road.</p><p>&quot;Mostly they were sick and tired, senhor.&quot;</p><p>Three years on that coast, he said. Three years of fever and bad water and worse rations, of burying people, of a garrison that had stopped being paid, and at the end of it a Portuguese army and an order to get back on the same ships that had brought them — for another crossing, four thousand leagues, in a hold, at that age, with that chest, having already done it once and knowing exactly what it was.</p><p>&quot;And a man stands on the sand and he looks at the boat,&quot; Aubin said, &quot;and he looks at the shore. And on the shore there is a woman he has been living with for two years and a child who knows his voice and a hut that does not move under him and food he can catch with his hands. And on the boat there is five months of vomiting and then France, where he owns nothing, because he never owned anything, which is <em>why he came.</em>&quot;</p><p>He turned his hands over.</p><p>&quot;They were not staying for anything. They just could not face the water again. That is the whole of it. Half of this town is here because a few dozen men were too tired to get back on a ship.&quot;</p><div class=\"brk\">&#10022;</div><p>Fermat thought about a longboat pulling away into a storm, oars biting, not looking back.</p><p>Sailors, he thought, are always making this trade. Every one of them, every time. Bertrand and his crew had chosen the sea over the people standing on the wreck, and had rowed off very competently, and were presumably alive somewhere and not troubled about it.</p><p>And these men, fifty-one years ago on this same coast, had made the identical trade in the opposite direction — had chosen the people over the sea, and had paid for it with their name, their country, their language&#x27;s future, and any possibility of ever being written down again.</p><p>Nobody had made a ballad about either group. But only one of them had been called a curse.</p><div class=\"brk\">&#10022;</div><p>The Portuguese, Aubin went on, had been very good about it, in the way of an administration with more coastline than clerks. They took the fort. They kept the harbour. They kept the name, which everyone agreed was strange and nobody was going to be the one to raise. And then they got on with the enormous business of holding a colony, and did not, for years at a stretch, come very far up the north road.</p><p>And every so often — every few years, when a new man arrived from Belém or Lisbon with a commission and an appetite — somebody would ride out and find, in the middle of country that was supposed to contain nothing at all, a village.</p><p>&quot;And they say: what is this.&quot;</p><p>&quot;And you say?&quot;</p><p>&quot;We say it is nothing.&quot; Aubin&#x27;s face did something complicated. &quot;We say: it is very new. We say: we put this up last week, senhor, it is hardly anything, we are sorry for the trouble.&quot;</p><p>Fermat looked at him.</p><p>&quot;A village.&quot;</p><p>&quot;A village.&quot;</p><p>&quot;Built last week.&quot;</p><p>&quot;Built last week,&quot; Aubin said, &quot;for fifty-one years.&quot;</p><div class=\"brk\">&#10022;</div><p>Fermat put his head back against the wall of the step and laughed until he had to stop and hold his ribs, and Aubin watched him do it with enormous satisfaction, and a woman going past with a basket said something that made Aubin laugh too, and Fermat did not understand it and did not need to.</p><p>&quot;They know,&quot; Aubin said, when they had both got hold of themselves. &quot;You understand. They are not stupid men. A wall that is one week old does not have a tree growing out of it.&quot;</p><p>&quot;Then why—&quot;</p><p>&quot;Because what would they <em>do?</em>&quot; He said it without any bitterness at all, which was the thing that finally made Fermat pay proper attention. &quot;Throw us out? Where? We are not French. Ask a Frenchman — you are a Frenchman, ask yourself. Am I French?&quot;</p><p>Fermat, who had spent four days pretending to be a Portuguese merchant and had that morning been undone by a boy on a wall, did not answer immediately.</p><p>&quot;No,&quot; Aubin said, comfortably. &quot;So they cannot expel us to France, and they cannot expel us to the forest, because half of us are already from the forest and know it better than they do. And we do not fight anybody and we sell them fish. So they write down that there is nothing on the north road, and they go home, and the next man comes in six years and finds a village, and we tell him we built it last week, and he writes down that there is nothing on the north road.&quot;</p><p>He shrugged.</p><p>&quot;Fifty-one years. It is the same joke. Nobody is laughing except us, and only because we started.&quot;</p><div class=\"brk\">&#10022;</div><p>It was, Fermat thought later, the most elegant thing he had encountered since arriving, and he turned it over for a long time before he could say why.</p><p>They had not resisted. That was the whole of it. A resistance is a thing an administration knows how to answer — it can be counted, engaged, defeated, and entered in a ledger as defeated. What Aubin&#x27;s people had done instead was decline to be <em>enterable</em>. They had made themselves into a quantity that could not be written down: not French, because France had sailed; not Portuguese, because no one had ever offered; not a rebellion, because they sold fish; not nothing, because there was plainly a village.</p><p>Every six years a competent official rode up the north road, applied a perfectly good instrument to the problem, and rode back with the only answer his instrument could produce, which was <em>nothing</em>.</p><p><em>I have spent forty years</em>, Fermat thought, <em>proving that certain things cannot exist. And I have arrived, at the end of it, among people who have spent fifty-one years proving the same thing about themselves, on purpose, to a government — and who are, every one of them, standing right here.</em></p><p>He had never once considered that the result might be a place to live.</p><div class=\"brk\">&#10022;</div><p>&quot;Aubin.&quot;</p><p>&quot;Senhor.&quot;</p><p>&quot;The fort. The one down there. That is the French fort — the original, the one from the year twelve.&quot;</p><p>&quot;It is.&quot;</p><p>&quot;And when they ask about <em>that?</em>&quot;</p><p>Aubin looked at him for a moment with real affection, the way one looks at a clever child who has almost got there.</p><p>&quot;Senhor,&quot; he said, &quot;the fort is the one thing we cannot say we built last week. It is stone and it is enormous and it has their governor sitting in it.&quot;</p><p>&quot;So what do you say?&quot;</p><p>&quot;Nothing at all.&quot; He got up off the step, and brushed himself down, and delivered it over his shoulder with fifty-one years of timing behind it. &quot;<em>They</em> built that. Ask them. It has their king&#x27;s name on it.&quot;</p>"}, {"title": "The Children of the Sea", "sub": "The north road, late", "html": "<p>He asked Aubin about the name on the walk back, because it had been bothering him since the boy on the wall, and because he had reached the stage of tiredness where a man asks the questions he has been saving.</p><p>&quot;They call you something,&quot; Fermat said. &quot;In the town. I have heard it four times and I cannot make it out. It sounds French and it is not being said by anyone French.&quot;</p><p>&quot;<em>Le Mer,</em>&quot; Aubin said.</p><p>&quot;That is not a name.&quot;</p><p>&quot;No.&quot;</p><p>&quot;It is not even correct. It should be <em>la</em> — the sea is—&quot; He stopped, hearing himself, sixty-four years old, correcting the gender of an article in the only surname a whole people had.</p><p>Aubin was smiling at the road ahead.</p><p>&quot;It has been said wrong for fifty years, senhor. By people who were not taught. It is ours now. If you fix it, it stops being ours and starts being French again, and we have been through that.&quot;</p><div class=\"brk\">&#10022;</div><p>He explained it the way he explained everything, which was without any particular weight, as though it were an ordinary administrative fact and not the saddest thing Fermat had heard in a decade.</p><p>When a priest or a clerk or a sergeant with a book had needed to write one of them down — for a baptism, for a levy, for a body — the question came in the same order every time. Name. Father.</p><p>And there was no father to give. Not because nobody knew. In many cases everybody knew perfectly well, and could have pointed at a man, or at a grave, or at a horizon. But a name is not a fact about who begot you. A name is a claim on a family, in a country, backed by somebody willing to stand up and be counted for it, and there was nobody in France who was going to do that for a child in Maranhão, and the men who might have were either dead, or on a boat, or standing right there with no legal existence of their own to lend.</p><p>So the clerks wrote what they could see. <em>Of the sea.</em> The child came from the direction of the sea; the father came off the sea; the whole business arrived by sea and departed by sea and the sea was the only party to it that was still around.</p><p>&quot;They meant it as <em>nothing</em>,&quot; Aubin said. &quot;You understand. It was not a kindness and it was not cruelty. It was a man with a book who needed something in the second column.&quot;</p><div class=\"brk\">&#10022;</div><p>Fermat walked a while without saying anything.</p><p>He was thinking about the men on the beach in the year fifteen — the ones too tired to face the water, who had looked at five months in a hold and a country where they owned nothing, and had turned around an

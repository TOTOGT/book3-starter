d stayed.</p><p>They had refused the sea. That was the single act of their lives that anyone would ever be able to point to. They had stood on that sand and declined, finally and permanently, to get back on the water.</p><p>And the sea had taken their children&#x27;s names anyway.</p><div class=\"brk\">&#10022;</div><p>&quot;And this is why they cannot expel you,&quot; he said, at last. &quot;I have had it backwards all afternoon. I thought the joke was that you are difficult to find. It is not that at all.&quot;</p><p>&quot;No,&quot; Aubin agreed.</p><p>&quot;A man can be expelled to somewhere. That is the whole mechanism — it is not a punishment, it is a <em>transfer</em>. You take a person out of one column and you enter him in another, and the second column has to exist, or the operation is not defined.&quot;</p><p>&quot;Senhor, I understand about half of that.&quot;</p><p>&quot;You understand all of it. You have been living inside it for fifty-one years.&quot; Fermat had stopped walking. &quot;There is no France that will receive you. There is no Portugal that has offered. The forest is not a column in anyone&#x27;s book. You are not a rebellion, you are not a garrison, you are not a parish. Every instrument they have is designed to move a man from one place to another place, and you—&quot;</p><p>He was aware that his voice had gone strange, and did not much care.</p><p>&quot;—<em>you have nowhere to be sent.</em> Not because you are hidden. Because there is no second column. They are not failing to catch you. They are failing to have anywhere to put you, which is a different failure entirely, and it is theirs, and it has protected you for half a century.&quot;</p><p>Aubin considered this.</p><p>&quot;That is a great many words,&quot; he said, &quot;for <em>we have no country.</em>&quot;</p><p>&quot;Yes,&quot; said Fermat. &quot;It is. I have spent my life on that particular vice.&quot;</p><div class=\"brk\">&#10022;</div><p>They walked on.</p><p>The thing he did not say — because he had known Aubin for one afternoon, and because he was not certain he could have got through the sentence — was that he had spent four days in this town believing himself to be the strange case. The dead man. The counterexample. The one entry in the world&#x27;s books that had been made and then unmade on purpose, by arithmetic, at enormous cost.</p><p>He had done it deliberately, at sixty-four, with a physician and a carter&#x27;s body and three days between a death and a departure in the same port.</p><p>And here was a whole people who had been born into it, who had never once been entered in anything, who had no France to be sent back to and no name that a clerk had not invented out of the weather —</p><p>— and who had, at some point in fifty-one years, stopped experiencing it as a wound and started using it as a wall.</p><p><em>They are better at this than I am</em>, he thought, walking up the north road in the dark beside a man his own age who had never in his life owned a document.</p><p><em>I have been dead for seven months and I am still checking to see whether anyone noticed.</em></p>"}, {"title": "O Conselheiro", "sub": "São Luís, the first year", "html": "<p>Nobody ever asked him for a surname.</p><p>He had prepared one. He had prepared, in the months before La Rochelle, several — a merchant family out of Bayonne, a modest lineage with a modest and entirely uninteresting history, the sort of thing that answers a question and closes it. He had rehearsed the pronunciation. He had worked out which of his own mannerisms would have to be filed off to support it.</p><p>He was never once required to produce it. Not by the corporal with the wax tablet, not by the garrison, not by the governor&#x27;s secretary, not by any of the four hundred people who came to know him over the following year.</p><p>It took him a long time to understand that this was not luck. It was the local arrangement, and it was the most sophisticated thing about the town.</p><div class=\"brk\">&#10022;</div><p>He worked it out from the direction he always worked things out from, which was the direction of the exceptions.</p><p>There were men in São Luís who were called by a trade — <em>the cooper</em>, <em>the pilot</em>, <em>the one who mends nets</em>. There were men called by where they had come from, which was never more precise than a coastline. There were men called by a thing they had once done, which in two cases he was fairly sure was a crime, cheerfully retained. There were the Le Mer, whose entire surname was a clerk&#x27;s shrug at a horizon.</p><p>And then there were the ones with proper surnames, and Fermat noticed, over about four months, that those were the only names in São Luís that anybody ever said <em>carefully.</em></p><p>Not with hostility. That was what took him so long. There was no cruelty in it that he could point to, no shunning, nothing a magistrate could have written up. Merely a small hesitation, once, when the name was first mentioned to a newcomer, and then a subject change — the sound of a town collectively agreeing not to develop a topic.</p><p>Nunes. Mendes. Cardoso. Rodrigues. Names out of Portugal that had come north with families who had come north from Pernambuco after fifty-four, and before that from Amsterdam, and before that from somewhere they did not discuss.</p><p>You could leave Recife. You could put four hundred leagues and a change of province between yourself and the Holy Office. But the name came with you — it was on the cargo manifest, on the bill of sale, on the license to trade, in the mouth of every man you had ever done business with — and it arrived before you did, and it said what it said.</p><p><em>They can change what they eat</em>, Fermat thought. <em>They can change what they do on a Saturday. They can go to Mass every week of their lives and have their children go, and their children&#x27;s children. They cannot change the one thing that is written on everything they will ever sign.</em></p><p>He never enquired further than that. He wants it recorded, in whatever ledger receives such things, that he never once went and knocked.</p><div class=\"brk\">&#10022;</div><p>But he understood, after that, what the town had built.</p><p>In a place where a surname could be a death sentence and a great many people&#x27;s were, the whole society had quietly moved off surnames altogether. Not by decree. Nobody had decided it. It had simply become the case, over fifty years, that a man in São Luís was called by what he did, or where he&#x27;d washed up, or what he was good for — and that asking for anything more precise was a thing you did not do, because in this town the question <em>and your father?</em> had, within living memory, been the first line of an interrogation.</p><p>It was, Fermat thought, the single most humane piece of social engineering he had ever encountered, and it had been designed by nobody, and written down nowhere, and it worked.</p><p><strong>A surname is a claim of lineage. A title is only a claim about the present.</strong></p><p>That was the whole of it. A surname says: <em>here is where I come from, here is my grandfather, here is the thread you may pull.</em> A title says: <em>here is what I am useful for.</em> One of them can be followed backward by a man with a file. The other cannot be followed anywhere at all.</p><p>So the town used titles. And a great many of them, he noticed, were titles that a person had chosen the day they arrived.</p><div class=\"brk\">&#10022;</div><p>Which was how he became <em>o Conselheiro</em>, and why it cost him nothing.</p><p>It was not conferred. Nobody granted it. It accreted, over perhaps five months, out of a series of small occasions on which a dispute over a boundary or a debt or a boat had come to a stop, and somebody had said <em>ask the old Frenchman, he was something once</em>, and he had listened to both sides all the way to the end — which, as Senhora Ferreira had observed of somebody else entirely, was a rarer skill in São Luís than anyone would credit — and had then said something short that both parties could live with.</p><p>He did it perhaps a dozen times before he noticed it had become a role. He did it fifty times before he noticed what they were calling him.</p><p><em>Conselheiro.</em> The counsellor. The one you ask.</p><p>And the joke — which he did not share with Marie for nearly a year, because he could not work out how to say it without sounding as though he were complaining — was that it was <strong>the same job.</strong></p><p>He had spent thirty years on the bench in Toulouse. He had spent three of those years, and every last sou of a fortune, and a carter&#x27;s unclaimed body, and the name his father gave him, arranging never to do it again. He had crossed four thousand leagues, drowned his own money, been abandoned by his crew, been carried out of the sea by an animal, and walked into a town that could not pronounce him.</p><p>They had looked at him for five months and handed him back his own office in another language, and had not even needed to be told.</p><div class=\"brk\">&#10022;</div><p>He kept both, in the end, and used them in different rooms, and never once got them confused.</p><p><em>Pedro</em> was for the book. For the corporal&#x27;s tablet, for the licence, for the two occasions in twenty years when something had to be signed. It was a name with the corners taken off, and it did the only work a name in a ledger is required to do, which is to be the same shape twice.</p><p><em>O Conselheiro</em> was for the town. It was what a boy shouted from a wall. It was what a woman said at a door with a dispute behind her. It carried no father, no province, no thread to pull, and it could not be followed backward past the day he had washed up. It was, as far as he could ever determine, the safest thing anybody in São Luís possessed.</p><p>And <em>Pierre</em> was for one person, in one room, and there were years in which he heard it four or five times, and he never in his life found a way to explain to Marie what those four or five times did.</p><p>She had never had to be told either. She had simply gone on calling him the only thing he had actually brought with him — the one asset that had come through the reef, that no clerk had entered, that no Holy Office could have followed anywhere, and that was worth, he had come to understand with some precision, rather more than three ships of anything.</p>"}, {"title": "What the Margin Was For", "sub": "São Luís, the second year — under a tree, with an audience of children", "html": "<p>He was quite clear about what would happen if it came out.</p><p>Not a fine. Not a stripping of office — there was no office; the office had been buried at sea in a weighted sheet with a carter inside it. A magistrate of the Parlement of Toulouse who had bribed a physician, used an unclaimed plague corpse, defrauded the crown of a colonial commission, and removed from Versailles a woman the king had informed of his intentions — that was not a matter that ended in a document.</p><p>He had spent thirty years handing down sentences. He knew what this one was, and he had known it before La Rochelle, and had gone anyway.</p><p>But it was not the hanging he thought about in the second year. That was simple, and simple things did not keep him awake.</p><p>What kept him awake was that the same discovery would kill Marie, and Agnès, and Duval — a physician of eleven years&#x27; loyalty who had found him a body — and possibly the ship&#x27;s captain, and that every one of them had put themselves inside his arithmetic on the strength of his assurance that it would hold.</p><p><em>I have made four people into terms in an equation</em>, he thought, <em>and I am the only one of them who enjoys that sort of thing.</em></p><div class=\"brk\">&#10022;</div><p>And yet.</p><p>There was a thing he had begun doing under the tamarind at the end of the north road, on the afternoons when it was too hot to be anywhere else, which had started as a way of not going mad and had become the most reckless act of his life.</p><p>He had begun to talk about the infinitely small.</p><div class=\"brk\">&#10022;</div><p>He had never published it. He wanted that understood, in the account, by whoever eventually read it: he had <em>never published it.</em></p><p>He had written letters. Letters were different — a letter is to one man, and a man can be trusted or not trusted, and a letter can be burned by either end. He had sent Mersenne things that would have been very difficult to explain in the wrong room, and Mersenne had known exactly how to handle them, and had died in fifty-eight, and after that Fermat had been rather more careful.</p><p>But he had never put it in a book, and he had never signed it, and where the argument was at its most dangerous he had done what he always did, which was to indicate the result and decline to write out the proof.</p><p><em>There is not room in the margin.</em></p><p>He had let two generations of correspondents believe that was a mathematician&#x27;s vanity — the tease of a man who enjoyed being the only one who knew. He had never corrected them, because the correction was worse.</p><p>The truth was that a margin is small, and a small space is a place where a thing can be <em>mentioned</em> without being <em>taught</em>, and there is a very great deal of difference in law between a man who has mentioned something and a man who has taught it.</p><p>He had spent forty years mentioning.</p><div class=\"brk\">&#10022;</div><p>The year was <strong>1632</strong>. He remembered it the way other men remembered a war.</p><p>He had been thirty-one. In that year the Society of Jesus, through its Revisors General, forbade the teaching of indivisibles in its colleges — the whole method, Cavalieri&#x27;s method, the treatment of a line as though it were composed of points and an area as though it were composed of lines. Banned. Not disputed: banned, in the schools that trained nearly every educated man in Catholic Europe.</p><p>And in that same year Galileo was summoned to Rome.</p><p>Fermat had watched both from Toulouse, at thirty-one, with his own quadratures already in a drawer.</p><p>Galileo had been the most celebrated natural philosopher alive. He had had a pope who liked him. He had abjured on his knees in fifty-three, in a room, out loud, with the instruments in view, and had gone home to a house he was not permitted to leave and had died in it nine years later, blind, still under arrest.</p><p><em>And that was what happened to a famous man with friends</em>, Fermat thought, <em>for saying where the earth stood.</em></p><p>In fifty-one — he had been fifty — the Society had gone further and put indivisibles on the permanent list. Doctrines that could under no circumstances be taught or disseminated. Four of them touching directly on the infinitely small. Tacquet had written that the method made such war upon geometry that if it did not destroy geometry, it must itself be destroyed.</p><p>The objection was never really arithmetic. He had understood that early and had never said so aloud. The objection was that if a continuous thing is made of indivisible things, then the world is made of parts — and a world made of parts is a world that can be taken apart, and there were men whose entire authority rested on it not being that kind of world. The infinite belonged to God. It was, in the strict sense, an attribute. A man who handled it casually on paper was handling something that was not his.</p><p>Bruno had been burned for a version of that in the year sixteen hundred, and Fermat had never once heard a mathematician mention Bruno, and had always thought that silence was itself a datum.</p><div class=\"brk\">&#10022;</div><p>So: a magistrate. In Toulouse. In a parlement that had burned people within living memory, in a city that took the Faith seriously and took <em>sedition</em> more seriously, holding an office that existed to enforce exactly the kind of order the infinitely small offended against.</p><p>He had been the wrong man, in the wrong city, holding the wrong ideas, with the wrong job.</p><p>And he had solved it the way he solved everything, which was to find the form of the problem that admitted an answer. He could not stop thinking it. He could not safely say it. Therefore he would think it completely and say it incompletely, and he would put the incomplete version where a small space made the incompleteness look like style.</p><p>He had made his own silence into a mannerism, and had let it become his reputation, and had let men write to him for forty years calling him modest, or difficult, or coy.</p><p><em>Not room in the margin.</em></p><p>There had been room. There had never once been room in Toulouse.</p><div class=\"brk\">&#10022;</div><p>There was one further fact about São Luís, and he had established it in his first month, and it was the reason any of what followed was possible.</p><p><strong>There were no Jesuits.</strong></p><p>He had not believed it. He had asked three people, in three ways, over several weeks, because a Catholic colony without the Society was like a river without a bank — not unlikely, <em>structurally strange</em>, the sort of thing that indicates an error somewhere in one&#x27;s assumptions.</p><p>There was no error. Five years before he arrived, on Pentecost Sunday of sixty-one, the residents of this town had gone to the Jesuit college of Nossa Senhora da Luz, taken the priests out of their cells, and held them prisoner in a private house. In September of that year every one of them, Vieira included, had been put aboard a ship called the <em>Sacramento</em> and sent to Lisbon.</p><p>Not by a king. Not by a bishop. By <strong>the colonists</strong>, who wanted Indians to enslave and had a priest telling them they could not.</p><p>Fermat took a long time with this.</p><p>He had spent his life inside the machinery — thirty years administering it, and forty avoiding one particular blade of it — and he had never once considered the possibility that the machinery could simply be <em>picked up and put on a boat</em> by ordinary men who had had enough. It was not a legal act. There was no instrument for it. It had simply happened, on a Sunday, in this street, and the men who did it were still here and would point out the house.</p><p><em>They ban indivisibles in Coimbra</em>, he thought, <em>and in São Luís they carry the man who banned them down to the harbour.</em></p><div class=\"brk\">&#10022;</div><p>And the second fact, which arrived later and which he found he could not be glad about:</p><p>Vieira himself was, that very year, in a cell in Coimbra, being interrogated by the Holy Office on a charge of heresy.</p><p>Fermat received this in the way one receives news of an old adversary&#x27;s illness. The Society had banned his mathematics; the Society&#x27;s most formidable man in the New World had been thrown out of this town by slavers for defending Indians; and now the Inquisition had him. Everyone in the story was being crushed by the same apparatus, from different sides, and the apparatus had not been obliged to choose.</p><p><em>It is not a party</em>, he thought. <em>I have spent forty years being careful of the Jesuits as though they were a party — as though there were men with opinions who could in principle be argued with. They are not the thing I was afraid of. They were only the nearest edge of it.</em></p><div class=\"brk\">&#10022;</div><p>He never once relaxed.</p><p>That was what Marie could not get out of him, and they were still arguing about it years later. The Society was gone; the college stood empty; there was no man within four hundred leagues who had been trained to recognise a banned doctrine or would have known what to do with one.</p><p>And every time he sat down under that tree he looked, first, at the road.</p><p>&quot;They will come back,&quot; he told her.</p><p>&quot;You do not know that.&quot;</p><p>&quot;Marie. They have been thrown out of better places than this and have come back to every one of them.&quot; He said it without heat. &quot;A parlement is a building and a king is a man, and both can be waited out. That is what the Society <em>is</em> — it is the institution that outlasts the men who expel it. In sixty-one this town put them on a ship. It felt, I have no doubt, extremely final to everyone present.&quot; He shrugged. &quot;It will feel less final in thirty years, when the ones who did it are dead and the ones who benefit from it have grandchildren who do not remember why, and a ship arrives with four quiet men on it who are very good at schools.&quot;</p><p>He was right, of course, and did not live to see it, and had not expected to.</p><p>But it was why he never wrote anything down, and it was why the archive he eventually built was made of children.</p><div class=\"brk\">&#10022;</div><p>The children under the tamarind could not read.</p><p>That was the first thing, and he had established it early and without any particular emotion: not one of them could read, in any language, and only two had ever seen a book, and there was no school within four hundred leagues that would have had them.</p><p>They were Le Mer, most of them. Some were not. They ranged from about six to about sixty and behaved, as far as he could ever determine, identically.</p><p>He drew in the dirt with a stick.</p><p>He had begun with a rope and a stake and the ordinary things a man can show anybody about a circle. He had gone on to the business of a curve and the space under it, because the boy who had asked him about the buffalo had wanted to know how much water a certain bend of the river held, and had not accepted <em>a great deal</em> as an answer, and had been correct not to.</p><p>And one afternoon, having drawn the bend and cut it into strips with the stick, and having watched a child of perhaps nine ask, entirely unprompted, <em>what if you made them thinner</em> — he sat back on his heels in the dirt with his heart going like a much younger man&#x27;s.</p><p>Because the next thing was the thing. And there was no Society here. There was no parlement, no bishop with a college, no correspondent who might keep a letter, no drawer, no margin. There was an old man with a stick and thirty people the world had never once written down, none of whom could have testified in any court on earth as to what a doctrine even was.</p><p>&quot;Thinner,&quot; he said. &quot;Yes. Now. Suppose I ask you to make them so thin that they have no width at all — and yet there are so many of them that together they still fill the whole bend of the river. Both at once.&quot;</p><p>The nine-year-old looked at the dirt for a while.</p><p>&quot;That&#x27;s stupid,&quot; she said.</p><p>&quot;It is completely stupid,&quot; Fermat agreed, &quot;and it is also correct, and there are men in Rome who would very much prefer that neither of us had said it.&quot;</p><p>She did not ask who was in Rome. She had never heard of Rome. She asked whether it worked for the <em>other</em> bend as well, the one near the sandbar, and Fermat said that it did, and that this was in fact the entire point and had taken him thirty years to be sure of, and she said that thirty years seemed like a long time for something so stupid.</p><div class=\"brk\">&#10022;</div><p>He walked back that evening past the fort with the French king&#x27;s name on it and could not stop smiling, and Marie asked him what had happened, and he found he could not explain it in fewer than a thousand words and gave her four.</p><p>&quot;I said it out loud.&quot;</p><p>She waited.</p><p>&quot;The thing about the infinitely small. The one I have never written down anywhere that anyone could find. I said it out loud, in the open, in daylight, at ordinary speaking volume, to thirty people.&quot; He sat down heavily. &quot;And nothing happened, Marie. Nothing at all happened. A child told me it was stupid.&quot;</p><p>&quot;Was it stupid?&quot;</p><p>&quot;Extremely.&quot; He put his head back. &quot;It is the best thing I have ever done, and the safest place in the world to say it turned out to be a country where nobody can read, and I have been sixty-four years finding it.&quot;</p><div class=\"brk\">&#10022;</div><p>He never wrote it down there either. That was the strange part, and he examined it more than once and never entirely liked the answer.</p><p>The habit was forty years deep. A man who has spent his working life making sure the dangerous half of every thought stays in his head does not simply put it on paper because the bishop is four thousand leagues away. And there was a colder reason, which he admitted to himself only late: paper travels. Paper had been the one thing in his entire scheme he could not fully control — a manifest in Lisbon, a name in a book in Belém, a death notice in Toulouse. A written proof in São Luís would be an object, and objects go into holds, and holds go to Europe, and a proof in his hand was a signature.</p><p>So he taught it, and did not record it, and the whole of it — every step, complete, with the gaps he had never filled in for Mersenne or Pascal or anyone alive — went into perhaps forty people who could not write, most of whom did not know that the man teaching them had a surname, and none of whom had ever heard of Toulouse.</p><p>It was the least secure archive ever devised, and it could not be seized, subpoenaed, burned, indexed, or entered in any list of banned doctrines, because it was not anywhere.</p><p><em>Nothing on the north road</em>, he thought.</p><div class=\"brk\">&#10022;</div><p><em>Note for the margin: in 1632 the Society of Jesus, through its Revisors General under Jacob Bidermann, forbade the teaching of indivisibles in its colleges; in the same year Galileo Galilei was summoned to Rome. He abjured in 1633 and remained under house arrest until his death in 1642. In 1651 the Society placed indivisibles among the doctrines permanently forbidden — four of the listed propositions bearing directly on the infinitely small. The effects were still being felt in Jesuit mathematics a century later.</em></p><p><em>Fermat published almost nothing in his lifetime. Historians have generally attributed this to the temperament of a gifted amateur who preferred correspondence, and there is a real scholarly literature asking why he stayed quiet on infinitesimals in particular. This book proposes the least flattering and most ordinary explanation available: that he was a magistrate in a city that knew how to burn people, and that the safest place for a dangerous idea is a space too small to hold the proof.</em></p>"}, {"title": "What Arrived Without Its Head", "sub": "São Luís, late — the night he told her", "html": "<p>The news came the way all news came to São Luís, which was late, secondhand, and by way of somebody who had been told it by somebody on a ship.</p><p>A Dutch trader had it from a factor in Belém, who had it from Lisbon, and by the time it reached the tamarind it had been through four mouths and two languages and had acquired the shape that such stories always acquire, which is the shape of a joke.</p><p>They had dug up Descartes.</p><p>He had died in Stockholm sixteen years ago, in the service of the Queen of Sweden, and France had finally decided it wanted him back. They had put him in a box and started him across Europe, and the box had been eight months on the road.</p><p>And when they opened it in Paris, the head was gone.</p><div class=\"brk\">&#10022;</div><p>Fermat did not laugh, which the trader plainly found disappointing.</p><p>He asked three questions instead, in a voice that he heard, from somewhere outside himself, doing the courtroom thing.</p><p>Was it certain the skull was absent. It was.</p><p>Was anything else absent. Yes — the right index finger, which was not a mystery at all: the French ambassador to Sweden had taken it, quite openly, as a personal souvenir.</p><p>And what were people saying.</p><p>The trader shrugged. People were saying what people say. That the Swedes had kept the head on purpose. That a chemist had it. That someone had sold it. That the ambassador had been the least of the thieves. And — the trader said this last as though it were the funniest part, and drank — <em>that it was not him at all. That the box that left Stockholm was not the box that arrived, and that the great philosopher, who had been so very clever about everything else, had been clever about this too.</em></p><div class=\"brk\">&#10022;</div><p>He walked home the long way, past the fort, and did not go in for some while.</p><p>Marie found him on the step with his hands on his knees.</p><p>&quot;You have the face,&quot; she said.</p><p>&quot;I have the face.&quot;</p><p>&quot;Which face.&quot;</p><p>&quot;The one from the corridor at the fort.&quot; He did not look up. &quot;Sit down. I have to tell you something, and I have been arranging it in my head for two hours and it has not improved.&quot;</p><div class=\"brk\">&#10022;</div><p>He gave it to her in order, because that was the only way he could give anything.</p><p>&quot;A body has crossed Europe this year and arrived incomplete,&quot; he said, &quot;and the whole of Paris is now discussing whether the man in the coffin is the man on the plate. That is the first thing.&quot;</p><p>&quot;And?&quot;</p><p>&quot;And they are <em>enjoying</em> it, Marie. That is the second thing, and it is the one that matters. It is not an accusation. Nobody has been charged with anything. It is a diversion — a thing men say at a table, about a philosopher, in a year when there is not much else. It costs them nothing.&quot; He turned his hands over. &quot;But it puts the <em>shape</em> into the world. The shape of the question. That a coffin is a claim, and a claim can be wrong, and that a clever man might have made it wrong on purpose.&quot;</p><p>&quot;You think someone will apply the shape to you.&quot;</p><p>&quot;I think a shape, once it exists, gets applied to everything that fits it. It is the only reliable law I know about people.&quot; He rubbed his face. &quot;And I fit it perfectly. I was clever. I died at a convenient distance. There was no grave anyone can open — I made certain of that, and it was the best decision in the whole design, and it is now the single fact about my death that a man at a table would find most interesting.&quot;</p><div class=\"brk\">&#10022;</div><p>She let that sit.</p><p>&quot;There is a third thing,&quot; she said. &quot;You would not have this face for two of them.&quot;</p><p>&quot;There is a third thing.&quot;</p><p>He was quiet long enough that she put her hand on his arm.</p><p>&quot;Clément-Samuel has my offices,&quot; he said. &quot;He took them in the year I died — that was arranged, it was proper, it is what a son does. And he has my papers. All of them. Everything in the house, everything in the drawer, forty years of it.&quot;</p><p>&quot;Yes.&quot;</p><p>&quot;He will publish them.&quot;</p><p>He said it flatly and then stopped, and Marie waited, and after a while he went on in a voice she had heard perhaps twice.</p><p>&quot;He was the one who understood what I was. The others loved me. Clément-Samuel <em>read</em> me. He used to come in and sit and not speak until I looked up, and then ask the one question I had not wanted asked.&quot; Fermat&#x27;s mouth moved. &quot;He will spend years on it. He will go through every scrap and letter, and he will get it right, because he is careful and because he will think he is doing the only thing left that he can do for me.&quot;</p><p>&quot;Pierre.&quot;</p><p>&quot;And when he is finished he will print, among a great many other things, a note I made in the margin of a Diophantus about twenty-five years ago, in which I state that I have a demonstration of a certain proposition and that the margin is too narrow to contain it.&quot;</p><p>He looked up at her for the first time.</p><p>&quot;And every mathematician in Europe will read it. And they will want to <em>ask me.</em>&quot;</p><div class=\"brk\">&#10022;</div><p>&quot;They cannot ask you,&quot; Marie said. &quot;That is the entire point of what we did.&quot;</p><p>&quot;They cannot ask me. So they will look for the proof. And when they cannot find the proof, some of them — not many, but the field does not need many — will begin to wonder whether a man who left that particular note behind was quite as finished as everyone assumed.&quot; He held up a hand before she could speak. &quot;I am not saying it is likely. I am saying it is <em>the same shape.</em> A dead man who is unusually clever, and something missing from the record, and no grave to settle it.&quot;</p><p>&quot;You are frightening yourself with a coincidence.&quot;</p><p>&quot;I am frightening myself with a <em>class</em> of coincidence, which is a different animal and I have spent my life on it.&quot; He almost smiled. &quot;But you are right that I have no business doing it out loud, so let me say the part I actually came home to say, which I have been walking around for two hours.&quot;</p><div class=\"brk\">&#10022;</div><p>&quot;My son is going to spend five years of his life being a good son to a man who is sitting on a step in Maranhão.&quot;</p><p>Marie did not say anything at all.</p><p>&quot;He will be forty when he finishes. He will have given the best working years he has to assembling his father, and he will do it beautifully, and he will believe every day of it that he is completing something. And the whole enterprise is a kindness performed on a lie that I told him.&quot; He was not crying; he simply had the flat voice. &quot;And the terrible part — the part I have not been able to put down since the trader stopped talking — is that I want him to do it. I want it very badly. I have wanted it since La Rochelle and I have not once admitted it.&quot;</p><p>&quot;Because it is your work.&quot;</p><p>&quot;Because it is my work, and because it is the only version of me that gets to survive, and because I am <em>vain</em>, Marie, in the one way I could never train out of myself.&quot; He put his head in his hands. &quot;I let them bury a carter. I have not sent word in eighteen months. And what I am sitting here grieving is not my wife and not my children. It is that I will never know whether the boy got the Diophantus right.&quot;</p><div class=\"brk\">&#10022;</div><p>She did not tell him he was a good man. She had never once done that, and he had loved her for eleven years partly on that basis.</p><p>She said: &quot;Then he gets to finish it.&quot;</p><p>&quot;What?&quot;</p><p>&quot;He gets to finish it. That is the thing you are describing, and you are describing it as a horror.&quot; She turned to face him properly. &quot;Pierre, you cannot write to him. If you write to him you kill him, and Duval, and Agnès, and probably me. There is no version where you send that letter. So the only question left is what you do with the wanting, and I am telling you what to do with it.&quot;</p><p>&quot;Which is?&quot;</p><p>&quot;You let it be a gift instead of a theft.&quot; Her hand was still on his arm. &quot;He will publish his father, and he will be proud, and he will be right to be — because everything he prints will be <em>true</em>, every line of it. You did the work. The only false thing in the entire volume will be the date on the front.&quot;</p><p>Fermat sat with that for a long moment.</p><p>&quot;That is a magistrate&#x27;s argument,&quot; he said eventually. &quot;That is a very good magistrate&#x27;s argument.&quot;</p><p>&quot;I sat next to you at a table in Toulouse for six years listening to you make them. I did not waste the time.&quot;</p><div class=\"brk\">&#10022;</div><p>They stayed out there a while longer, in the dark, and the buffalo came up the north road at the hour she always came and stood at the edge of the light doing nothing whatsoever, and neither of them remarked on it, because by then it would have been strange if she had not.</p><p>&quot;The margin,&quot; Fermat said at last.</p><p>&quot;Mm.&quot;</p><p>&quot;I have been telling people for forty years that there was not room. It was the most useful sentence I ever wrote. It was not even a lie — there genuinely was not room, on that page, that day.&quot; He shook his head slowly. &quot;But there was never room in Toulouse either, and I let one stand for the other, and now a boy who cannot read is going to know the whole of it and my son is going to publish the excuse.&quot;</p><p>&quot;Does that trouble you?&quot;</p><p>He thought about it honestly, which took a while.</p><p>&quot;No,&quot; he said, and sounded surprised. &quot;That is the strangest part. It does not. If the choice is that Europe keeps the sentence and Maranhão keeps the proof — I find I would make that trade again. Twice.&quot; He stood up, slowly, sixty-five years old and stiff in every joint the sea had ruined. &quot;It is the only thing I have arranged in two years that I am not ashamed of.&quot;</p>"}, {"title": "What He Had No Idea He Had Done", "sub": "Epilogue", "html": "<div class=\"brk\">&#10022;</div><p>He died on Marajó, and the herd did not.</p><p>That is the whole of the ending, and it took three hundred and sixty years to finish saying.</p><div class=\"brk\">&#10022;</div><p>He never knew how many there were. He had bought three ships of them in Lisbon with a fortune he had spent three years liquidating, and had lost the ships, and had watched two of them stand off a reef doing arithmetic and then leave, and the animals that got out of those holds swam to whatever coast the current gave them and walked inland into standing water and were never counted by anybody, ever, at all.</p><p>He tried. Of course he tried. He was the most exact mind in Europe and he spent a not inconsiderable part of twenty years attempting to establish a figure — asking, riding out, taking accounts from men who had seen a great many and men who had seen a few and men who were lying — and arrived, in the end, at the only honest result his method could produce, which was that the quantity existed and could not be determined.</p><p>He wrote it down once, on Marajó, in the only line of mathematics anyone ever found in his hand there, and then did not develop it:</p><p><em>A great many. Increasing.</em></p><div class=\"brk\">&#10022;</div><p>He thought of it, when he thought of it at all, as a loss.</p><p>That is the part worth saying plainly. He did not consider himself to have introduced anything. He considered himself to have been robbed by two ships&#x27; captains and a reef, and to have salvaged, out of the wreck of an enormous and carefully reasoned enterprise, one animal that came back in the evenings for reasons he never established.</p><p>The town remembered it his way, and got it slightly wrong in the direction of comedy, and made him into what he remains: <em>um francês que ficou conhecido pelos búfalos que ele perdeu no Brasil.</em> A Frenchman known for the buffalo he lost.</p><p>Not the theorems. Not the bench, not the correspondence, not the margin. Not the death he engineered, which worked so well that no one has ever thought to look for it. A failure of cargo management, four thousand leagues from anyone who would have understood what else he had been.</p><p>He would have found that funny. He found most things funny for a day or so.</p><div class=\"brk\">&#10022;</div><p>What nobody in São Luís could have told him — what he had no instrument for, and no vocabulary for, and would have needed another three centuries of somebody else&#x27;s science to see — is that <em>he had not lost anything.</em></p><p>He had <strong>released</strong> something.</p><p>The animals that came out of those holds were not from that continent. Nothing on that coast had evolved alongside them: not the grasses, not the reeds, not the fish in the flooded ground, not the birds, not the caiman, not the people. He had taken a species from one side of the world, converted his entire fortune into it because it could not be seized or stolen or counted, and put it into a wet country that had no answer for it — and then it got away from him, which was the only part he ever knew about.</p><p>He had been right that they would thrive. That had been the whole basis of the purchase, argued against every man who advised him, and it was the single most correct commercial judgement of his life.</p><p>He had simply not understood what the word meant.</p><div class=\"brk\">&#10022;</div><p>Three hundred and sixty years later they are still there, and they are Marajó&#x27;s — on the flags, in the restaurants, under the police, in every photograph anyone has ever taken of the island. They are the reason the place is called what it is called. Ask anyone on that island whether the buffalo belong there and you will get a look, because the question is not sensible: they have been there longer than anyone&#x27;s grandmother.</p><p>They are also, in the strict technical sense that no one uses out loud, an introduced species.</p><div class=\"brk\">&#10022;</div><p>And in a different country, on a different river, there is a second case.</p><p>Four hippopotamuses were brought to Colombia in the nineteen-eighties for a private zoo belonging to a man who was killed on a rooftop in Medellín in 1993, after which the animals fended for themselves. There are now about two hundred of them in the Magdalena basin. The Environment Ministry expects more than five hundred by 2030. In April of 2026 the government approved a cull of up to eighty, at a cost of some 7.2 billion pesos, to begin in the second half of the year, near Puerto Triunfo and along the river. They eat enormous quantities of vegetation, they change the chemistry of the water, and they are dangerous to manatees, to turtles, and to people.</p><p>Nobody calls them heritage.</p><p>The animals are innocent in both cases. The men were not consulted about what they were doing, because neither of them thought he was doing it — one was buying a curiosity, and one was buying a fortune he could carry, and both of them lost control of it in an entirely ordinary way, and died.</p><p><strong>The only real difference between a beloved animal and an invasive one is how long ago the mistake was made.</strong></p><p>Escobar&#x27;s hippos have had forty years. Fermat&#x27;s buffalo have had three hundred and sixty. Give the hippos three centuries and the Magdalena will put one on a postcard.</p><div class=\"brk\">&#10022;</div><p>There is no moral available here that this book is willing to offer, and it has tried.</p><p>He was a good man in the ways that were available to him. He faked his own death to get a woman out of a palace and did not once, in twenty years, ask her for anything in return. He taught the infinitely small to children under a tree because there was nowhere left in the Christian world he could say it out loud. He worked out what his neighbours were and never went and knocked. He listened to both sides all the way to the end.</p><p>And he put an African animal into South America, in bulk, for money, and then failed to keep track of it, and the consequence outlived every single thing he ever proved.</p><p><em>A great many. Increasing.</em></p><p>He was, in the end, exactly right about the only quantity he could never determine — which is a fair description of the whole of his life, and would have irritated him enormously.</p>"}];
const MAXPAGES = 50;
const RUNHEAD  = "Pierre et Mademoiselle";

const book = document.getElementById('book');

function newPage(){
  const p = document.createElement('div');
  p.className = 'page';
  book.appendChild(p);
  return p;
}
function frame(page, right, n){
  const rh = document.createElement('div');
  rh.className = 'rh';
  rh.innerHTML = '<span>'+RUNHEAD+'</span><span>'+right+'</span>';
  page.insertBefore(rh, page.firstChild);
  const f = document.createElement('div');
  f.className = 'folio';
  f.textContent = n;
  page.appendChild(f);
}

/* --- title page --- */
const tp = newPage();
tp.innerHTML = '<div class="tp">'+
  '<div class="ey">A Limited Series &middot; Sample Pages</div>'+
  '<h1>Pierre <em>et</em> Mademoiselle</h1>'+
  '<div class="rule"></div>'+
  '<div class="dk">In 1665 the greatest mathematician in Europe proved that a man could stop existing. '+
  'It was the only theorem he ever tested on himself.</div>'+
  '<div class="by">Pablo Nogueira Grossi<br>G6 LLC &middot; Newark, New Jersey<br>'+
  'Based on the true and documented death of Pierre de Fermat</div></div>';

/* --- flow the chapters --- */
let pageNo = 0, page = null, body = null, done = false;

function startPage(runRight){
  page = newPage();
  pageNo++;
  frame(page, runRight, pageNo);
  body = document.createElement('div');
  page.appendChild(body);
}
function fits(){
  // 1056 height - 96 top pad - 72 bottom pad, minus runhead/folio allowance
  return body.getBoundingClientRect().height <= 806;
}

outer:
for (const ch of CHAPTERS){
  startPage(ch.title);
  const head = document.createElement('div');
  head.innerHTML = '<h2 class="ct">'+ch.title+'</h2>'+
                   (ch.sub ? '<div class="cs">'+ch.sub+'</div>' : '');
  body.appendChild(head);

  const tmp = document.createElement('div');
  tmp.innerHTML = ch.html;
  const blocks = Array.from(tmp.children);

  for (const b of blocks){
    body.appendChild(b);
    if (!fits()){
      body.removeChild(b);
      if (pageNo >= MAXPAGES){ done = true; break outer; }
      startPage(ch.title);
      body.appendChild(b);
    }
  }
  if (pageNo >= MAXPAGES){ done = true; break; }
}

/* --- to be continued --- */
const end = newPage();
end.innerHTML = '<div class="tbc"><div class="big">To be continued&hellip;</div>'+
  '<div class="sm">Sample ends at page '+pageNo+'</div></div>';

document.getElementById('count').textContent =
  pageNo + ' numbered pages' + (done ? ' · capped at ' + MAXPAGES : '');
</script>
